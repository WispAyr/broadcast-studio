<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Broadcast Studio — GLSL Shader QA</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #05070d; color: #cbd5e1; font: 14px/1.4 ui-sans-serif, system-ui, sans-serif; }
  header { padding: 18px 22px; border-bottom: 1px solid #1e293b; }
  h1 { margin: 0; font-size: 18px; color: #fff; }
  header p { margin: 4px 0 0; color: #64748b; font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; padding: 18px 22px; }
  .cell { border: 1px solid #1e293b; border-radius: 14px; overflow: hidden; background: #000; }
  .cvswrap { position: relative; aspect-ratio: 16/9; }
  canvas { width: 100%; height: 100%; display: block; }
  .label { position: absolute; left: 8px; bottom: 8px; padding: 3px 8px; border-radius: 8px;
           background: rgba(0,0,0,.6); font-family: ui-monospace, monospace; font-size: 12px; color: #e2e8f0; }
  .ok { color: #34d399; } .bad { color: #f87171; }
  .err { padding: 8px 10px; font-family: ui-monospace, monospace; font-size: 11px; color: #fca5a5;
         white-space: pre-wrap; background: #1a0a0a; display: none; }
  .cell.failed .err { display: block; }
  #summary { padding: 0 22px 22px; font-family: ui-monospace, monospace; }
</style>
</head>
<body>
<header>
  <h1>GLSL Shader QA — broadcast-grade library</h1>
  <p>Renders every custom shader through the same WebGL2 pipeline the Studio uses. Green = compiles &amp; runs. Includes uParam controls + a procedural uSpectrum.</p>
</header>
<div class="grid" id="grid"></div>
<div id="summary"></div>
<script>
const VERT = `#version 300 es
in vec2 aPos;
void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }`;

const PREAMBLE = `#version 300 es
precision highp float;
uniform vec3  iResolution;
uniform float iTime;
uniform vec4  iMouse;
uniform vec3  uColors[8];
uniform int   uColorCount;
uniform vec3  uBg;
uniform float uScale;
uniform float uSoftness;
uniform float uDistortion;
uniform float uRotation;
uniform float uIntensity;
uniform float uAudio;
uniform vec4  uParam;
uniform float uSpectrum[16];
out vec4 fragColor;
#define PI 3.14159265359
#define TAU 6.28318530718
mat2 rot(float a){ float s=sin(a), c=cos(a); return mat2(c,-s,s,c); }
vec3 palette(float t){
  int n = uColorCount;
  if(n <= 0) return vec3(t);
  if(n == 1) return uColors[0];
  t = clamp(t, 0.0, 1.0) * float(n - 1);
  float f = floor(t); int i = int(f); int j = min(i + 1, n - 1);
  return mix(uColors[i], uColors[j], t - f);
}
float hash21(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.0-2.0*f);
  float a=hash21(i), b=hash21(i+vec2(1,0)), c=hash21(i+vec2(0,1)), d=hash21(i+vec2(1,1));
  return mix(mix(a,b,u.x), mix(c,d,u.x), u.y); }
float fbm(vec2 p){ float v=0.0,a=0.5; for(int i=0;i<6;i++){ v+=a*vnoise(p); p=rot(0.5)*p*2.0+3.1; a*=0.5; } return v; }
`;
const EPILOGUE = `\nvoid main(){ mainImage(fragColor, gl_FragCoord.xy); }`;
const UV = `vec2 uv = (fragCoord - 0.5*iResolution.xy) / iResolution.y;`;

const SHADERS = {
  aurora: `
void mainImage(out vec4 O, in vec2 fragCoord){
  ${UV}
  uv = rot(uRotation) * uv; float t = iTime * 0.15; vec2 p = uv * (1.6 / uScale); vec3 col = uBg;
  for(int i=0;i<4;i++){ float fi=float(i); float y=p.y+0.18*fi-0.2;
    float n=fbm(vec2(p.x*1.4+t*(1.0+0.15*fi)+fi*11.0, t*0.4+fi));
    float w=0.35+0.55*uDistortion; float band=smoothstep(0.55,0.0,abs(y+(n-0.5)*1.3*w));
    band*=1.0+uAudio*0.8; col += palette(fract(0.16*fi+n*0.55+t*0.5))*band*(0.55+0.2*uSoftness); }
  col = mix(col, uBg, smoothstep(0.45, 1.15, abs(uv.y))); O = vec4(col*uIntensity,1.0);
}`,
  'plasma-flow': `
void mainImage(out vec4 O, in vec2 fragCoord){
  vec2 uv=fragCoord/iResolution.xy; vec2 p=(uv-0.5); p.x*=iResolution.x/iResolution.y; p=rot(uRotation)*p/uScale;
  float t=iTime*0.10; vec2 q=vec2(fbm(p+vec2(0.0,t)),fbm(p+vec2(5.2,1.3)-t));
  vec2 r=vec2(fbm(p+(1.5+1.5*uDistortion)*q+vec2(1.7,9.2)+t*1.2),fbm(p+(1.5+1.5*uDistortion)*q+vec2(8.3,2.8)-t*0.8));
  float f=fbm(p+(2.0+2.0*uDistortion)*r); float shade=clamp(f*f*2.2+0.35*r.x+0.15*sin(t*2.0),0.0,1.0);
  vec3 col=palette(shade); col=mix(uBg,col,smoothstep(-0.1,0.55,f+0.25)); O=vec4(col*uIntensity,1.0);
}`,
  nebula: `
void mainImage(out vec4 O, in vec2 fragCoord){
  ${UV}
  uv=rot(uRotation)*uv; vec2 p=uv*(1.4/uScale); float t=iTime*0.08; vec3 col=uBg;
  for(int i=0;i<5;i++){ float fi=float(i); float n=fbm(p*(1.0+0.35*fi)+vec2(t*(0.5+0.12*fi),-t*0.3)+fi*7.0);
    n=pow(n,1.6+uDistortion); col+=palette(fract(0.12*fi+n+0.2*t))*n*(0.30+0.1*uSoftness); }
  col+=palette(0.92)*pow(max(0.0,1.0-length(uv)*0.75),3.0)*0.35;
  float star=step(0.995,hash21(floor(fragCoord*0.5))); col+=vec3(star)*(0.6+0.4*sin(iTime*3.0+fragCoord.x));
  O=vec4(col*uIntensity,1.0);
}`,
  kaleidoscope: `
void mainImage(out vec4 O, in vec2 fragCoord){
  ${UV}
  float a=atan(uv.y,uv.x); float r=length(uv); float seg=max(3.0,uParam.x);
  a=mod(a,TAU/seg); a=abs(a-TAU/(seg*2.0)); vec2 p=vec2(cos(a),sin(a))*r;
  p=rot(iTime*0.10+uRotation+r*uParam.y*2.0)*p/uScale; float t=iTime*0.2;
  float f=fbm(p*3.0+t)+0.5*sin(r*10.0-t*2.0+uDistortion*6.0);
  vec3 col=palette(fract(f*0.7+0.1*t)); col=mix(col,uBg,smoothstep(0.9,1.4,r)); O=vec4(col*uIntensity,1.0);
}`,
  'warp-tunnel': `
void mainImage(out vec4 O, in vec2 fragCoord){
  ${UV}
  uv=rot(uRotation)*uv; float a=atan(uv.y,uv.x); float r=length(uv);
  float depth=1.0/(r*uScale+0.05)+iTime*0.6*(1.0+uAudio); float u=a/TAU; float n=fbm(vec2(u*8.0,depth));
  float stripes=smoothstep(0.35,0.65,fract(depth+n)); vec3 col=palette(fract(depth*0.18+n*0.35));
  col*=0.55+0.75*stripes; col*=smoothstep(0.0,0.32,r); col=mix(uBg,col,smoothstep(0.0,0.25,r)); O=vec4(col*uIntensity,1.0);
}`,
  caustics: `
void mainImage(out vec4 O, in vec2 fragCoord){
  vec2 uv=(fragCoord/iResolution.xy)*vec2(iResolution.x/iResolution.y,1.0)*(3.0/uScale); uv=rot(uRotation)*uv;
  float t=iTime*0.4; vec2 p=uv; float c=0.0;
  for(int i=0;i<3;i++){ vec2 q=p+vec2(fbm(p+t),fbm(p-t)); float d=abs(sin(q.x*2.0)+cos(q.y*2.0)); c+=1.0/(d+0.3-0.15*uDistortion); p=q*1.35; }
  c*=0.17; vec3 col=mix(uBg,palette(clamp(c,0.0,1.0)),clamp(c,0.0,1.0)); col+=palette(0.85)*pow(clamp(c-0.6,0.0,1.0),3.0)*1.5;
  O=vec4(col*uIntensity,1.0);
}`,
  'voronoi-glow': `
void mainImage(out vec4 O, in vec2 fragCoord){
  ${UV}
  uv=rot(uRotation)*uv*(3.0/uScale); float t=iTime*0.5; vec2 g=floor(uv),f=fract(uv); float md=8.0; vec2 mp=vec2(0.0);
  for(int y=-1;y<=1;y++){ for(int x=-1;x<=1;x++){ vec2 o=vec2(float(x),float(y));
    vec2 rnd=0.5+0.5*sin(t+TAU*hash21(g+o)*vec2(1.0,1.3)); vec2 rr=o+rnd-f; float d=dot(rr,rr); if(d<md){md=d;mp=g+o;} } }
  float edge=sqrt(md); vec3 col=palette(fract(hash21(mp)));
  col*=mix(1.0,0.35+0.65*smoothstep(0.0,0.55,edge),uParam.y);
  col+=palette(0.9)*smoothstep(0.03+0.22*uParam.x,0.0,edge)*(1.0+uAudio); col=mix(uBg,col,0.9); O=vec4(col*uIntensity,1.0);
}`,
  'liquid-mesh': `
void mainImage(out vec4 O, in vec2 fragCoord){
  vec2 uv=fragCoord/iResolution.xy; vec2 p=(uv-0.5); p.x*=iResolution.x/iResolution.y; p=rot(uRotation)*p/uScale+0.5;
  float t=iTime*0.06; p+=0.28*uDistortion*vec2(fbm(p*2.0+t),fbm(p*2.0-t+5.0));
  float m=fbm(p*1.2+vec2(t,-t))*0.6+0.4*fbm(p*2.6-t); vec3 col=palette(smoothstep(0.15,0.85,m));
  col=mix(col,palette(fract(m+0.3)),0.5+0.5*sin(t+m*6.2831)); col=mix(uBg,col,0.92+0.08*uSoftness); O=vec4(col*uIntensity,1.0);
}`,
  'hex-grid': `
void mainImage(out vec4 O, in vec2 fragCoord){
  ${UV}
  uv=rot(uRotation)*uv; float dens=mix(3.0,16.0,clamp(uParam.x,0.0,1.0)); uv*=dens/uScale;
  vec2 r=vec2(1.0,1.7320508); vec2 h=r*0.5; vec2 a=mod(uv,r)-h; vec2 b=mod(uv-h,r)-h;
  vec2 gv=dot(a,a)<dot(b,b)?a:b; vec2 id=uv-gv; vec2 pp=abs(gv);
  float ed=max(dot(pp,normalize(vec2(1.0,1.7320508))),pp.x); float cell=hash21(id);
  float pulse=0.5+0.5*sin(iTime*(0.5+2.0*uParam.z)-length(id)*0.35+cell*TAU);
  vec3 col=palette(fract(cell*0.7+iTime*0.03))*(0.22+0.78*pulse);
  float edge=smoothstep(0.5,0.5-0.04-0.12*uParam.y,ed); col+=palette(0.85)*edge*(0.4+0.8*uParam.y)*(1.0+uAudio);
  col=mix(uBg,col,0.9); O=vec4(col*uIntensity,1.0);
}`,
  'ridged-fractal': `
void mainImage(out vec4 O, in vec2 fragCoord){
  ${UV}
  uv=rot(uRotation)*uv/uScale; float t=iTime*0.06; vec2 p=uv*1.6+vec2(t,-t*0.5);
  p+=(0.2+1.2*uParam.y)*vec2(fbm(p+t),fbm(p+3.7-t)); float rr=0.0,amp=0.55,freq=1.0;
  for(int i=0;i<6;i++){ float n=1.0-abs(2.0*vnoise(p*freq)-1.0); n=pow(n,1.0+3.0*uParam.x); rr+=amp*n; freq*=2.0; amp*=0.5; }
  vec3 col=palette(clamp(rr,0.0,1.0)); col=mix(uBg,col,smoothstep(0.08,0.7,rr)); O=vec4(col*uIntensity,1.0);
}`,
  starfield: `
void mainImage(out vec4 O, in vec2 fragCoord){
  ${UV}
  uv=rot(uRotation)*uv; vec3 col=uBg; float speed=0.15+1.4*uParam.y; float dens=mix(0.8,2.2,uParam.x);
  for(int i=0;i<90;i++){ float fi=float(i); float seed=hash21(vec2(fi,7.0)); float ang=seed*TAU+fi;
    vec2 dir=vec2(cos(ang),sin(ang)); float z=fract(seed+iTime*speed*(0.6+seed)); vec2 pos=dir*z*1.7*dens;
    vec2 rel=uv-pos; float along=dot(rel,dir); float perp=dot(rel,vec2(-dir.y,dir.x));
    float stretch=1.0+8.0*uParam.z*z; float d=length(vec2(along,perp*stretch)); col+=palette(fract(seed*0.6))*(0.016*z*z/(d+0.012)); }
  O=vec4(col*uIntensity,1.0);
}`,
  crt: `
void mainImage(out vec4 O, in vec2 fragCoord){
  vec2 uv=fragCoord/iResolution.xy; vec2 cc=uv*2.0-1.0; float cur=0.05+0.5*uParam.y; cc*=1.0+cur*dot(cc,cc)*0.35;
  vec2 s=cc*0.5+0.5; float t=iTime*0.1; float ab=0.002+0.03*uParam.z; vec3 col;
  col.r=palette(fract(fbm((s+vec2(ab,0.0))*2.0/uScale+vec2(t,-t)))).r;
  col.g=palette(fract(fbm( s             *2.0/uScale+vec2(t,-t)))).g;
  col.b=palette(fract(fbm((s-vec2(ab,0.0))*2.0/uScale+vec2(t,-t)))).b;
  float lines=mix(120.0,800.0,uParam.x); float scan=0.5+0.5*sin(s.y*lines*PI); col*=0.75+0.25*scan;
  col*=smoothstep(1.3,0.25,dot(cc,cc)); if(s.x<0.0||s.x>1.0||s.y<0.0||s.y>1.0) col=uBg; O=vec4(col*uIntensity,1.0);
}`,
  'spectrum-bars': `
void mainImage(out vec4 O, in vec2 fragCoord){
  vec2 uv=fragCoord/iResolution.xy; float barsF=mix(8.0,16.0,clamp(uParam.x,0.0,1.0)); int bars=int(barsF);
  float fx=uv.x*float(bars); int bi=clamp(int(floor(fx)),0,15); float real=uSpectrum[bi];
  float synth=(0.12+0.55*pow(0.5+0.5*sin(iTime*2.5+float(bi)*0.8),2.0))*(0.6+0.4*vnoise(vec2(float(bi),iTime*0.7)));
  float amp=real>0.001?max(real,synth*0.25):synth; amp=clamp(amp*(0.4+0.6*uParam.y),0.0,1.0);
  float e=fract(fx); float inbar=smoothstep(0.0,0.08,e)*(1.0-smoothstep(0.92,1.0,e)); float bar=step(1.0-amp,uv.y);
  vec3 barCol=palette(uv.x); vec3 col=barCol*bar*inbar; col+=barCol*smoothstep(0.0,0.12,uv.y)*amp*0.25*inbar;
  col=mix(uBg,col,max(bar*inbar,0.15)); O=vec4(col*uIntensity,1.0);
}`,
};

// Per-shader uParam defaults [x,y,z,w].
const PARAMS = {
  kaleidoscope: [6, 0.5, 0, 0], 'voronoi-glow': [0.5, 0.6, 0, 0],
  'hex-grid': [0.5, 0.7, 0.6, 0], 'ridged-fractal': [0.6, 0.5, 0, 0],
  starfield: [0.6, 0.5, 0.6, 0], crt: [0.5, 0.4, 0.5, 0], 'spectrum-bars': [1.0, 0.7, 0, 0],
};

const PALETTE = ['#0ea5e9','#7a5cff','#ff4fd8','#00ffd0'];
const BG = '#05010f';
const KNOBS = { scale: 1.2, softness: 0.6, distortion: 0.9, rotation: 0, intensity: 1, audio: 0 };

function hexToRgb(hex){ const n=parseInt(hex.replace('#',''),16); return [((n>>16)&255)/255,((n>>8)&255)/255,(n&255)/255]; }
function compile(gl,type,src){ const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){ const l=gl.getShaderInfoLog(s); gl.deleteShader(s); throw new Error(l); } return s; }
function spectrum(tSec){ const s=new Float32Array(16); for(let i=0;i<16;i++){ s[i]=Math.max(0,(0.35+0.5*Math.abs(Math.sin(tSec*2.2+i*0.6)*Math.cos(tSec*0.7+i)))*(1-i/22)); } return s; }

const grid = document.getElementById('grid');
const draws = [];
let pass = 0, fail = 0;
const uniformNames = ['iResolution','iTime','iMouse','uColors','uColorCount','uBg','uScale','uSoftness','uDistortion','uRotation','uIntensity','uAudio','uParam','uSpectrum'];

function setup(gl, prog){
  const u = {}; uniformNames.forEach(n => u[n] = gl.getUniformLocation(prog, n));
  return u;
}
function drawWith(gl, u, id, w, h, tSec){
  gl.uniform3f(u.iResolution,w,h,1); gl.uniform1f(u.iTime,tSec); gl.uniform4f(u.iMouse,0,0,0,0);
  const pal=new Float32Array(24); PALETTE.slice(0,8).forEach((c,i)=>{const[r,g,b]=hexToRgb(c);pal[i*3]=r;pal[i*3+1]=g;pal[i*3+2]=b;});
  gl.uniform3fv(u.uColors,pal); gl.uniform1i(u.uColorCount,PALETTE.length);
  const bg=hexToRgb(BG); gl.uniform3f(u.uBg,bg[0],bg[1],bg[2]);
  gl.uniform1f(u.uScale,KNOBS.scale); gl.uniform1f(u.uSoftness,KNOBS.softness);
  gl.uniform1f(u.uDistortion,KNOBS.distortion); gl.uniform1f(u.uRotation,KNOBS.rotation*Math.PI/180);
  gl.uniform1f(u.uIntensity,KNOBS.intensity); gl.uniform1f(u.uAudio,KNOBS.audio);
  const p = PARAMS[id] || [0,0,0,0]; gl.uniform4f(u.uParam,p[0],p[1],p[2],p[3]);
  gl.uniform1fv(u.uSpectrum, spectrum(tSec));
  gl.drawArrays(gl.TRIANGLES,0,3);
}

for (const [id, body] of Object.entries(SHADERS)) {
  const cell=document.createElement('div'); cell.className='cell';
  const wrap=document.createElement('div'); wrap.className='cvswrap';
  const cvs=document.createElement('canvas'); const label=document.createElement('div'); label.className='label';
  const err=document.createElement('div'); err.className='err';
  wrap.appendChild(cvs); wrap.appendChild(label); cell.appendChild(wrap); cell.appendChild(err); grid.appendChild(cell);
  try {
    const gl=cvs.getContext('webgl2',{antialias:true}); if(!gl) throw new Error('WebGL2 unavailable');
    const vs=compile(gl,gl.VERTEX_SHADER,VERT); const fs=compile(gl,gl.FRAGMENT_SHADER,PREAMBLE+'\n'+body+'\n'+EPILOGUE);
    const prog=gl.createProgram(); gl.attachShader(prog,vs); gl.attachShader(prog,fs); gl.linkProgram(prog);
    if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
    const quad=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,quad); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
    gl.useProgram(prog); const aPos=gl.getAttribLocation(prog,'aPos'); gl.enableVertexAttribArray(aPos); gl.vertexAttribPointer(aPos,2,gl.FLOAT,false,0,0);
    const u=setup(gl,prog);
    draws.push((tSec)=>{ const w=cvs.clientWidth||320,h=cvs.clientHeight||180; if(cvs.width!==w||cvs.height!==h){cvs.width=w;cvs.height=h;}
      gl.viewport(0,0,w,h); gl.useProgram(prog); drawWith(gl,u,id,w,h,tSec); });
    label.innerHTML = id + ' <span class="ok">✓</span>'; pass++;
  } catch(e){ cell.classList.add('failed'); label.innerHTML=id+' <span class="bad">✗ FAILED</span>'; err.textContent=String(e.message||e); fail++; }
}

// Switch-stress cell — recompile a new program on the SAME context repeatedly.
let switchCount=0, switchIdx=0, switchDraw=null; const ids=Object.keys(SHADERS);
{
  const cell=document.createElement('div'); cell.className='cell'; const wrap=document.createElement('div'); wrap.className='cvswrap';
  const cvs=document.createElement('canvas'); const label=document.createElement('div'); label.className='label';
  wrap.appendChild(cvs); wrap.appendChild(label); cell.appendChild(wrap); grid.appendChild(cell);
  const gl=cvs.getContext('webgl2',{antialias:true}); const quad=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,quad); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  let program=null,u=null,curId=ids[0];
  function build(id){ try {
    const vs=compile(gl,gl.VERTEX_SHADER,VERT); const fs=compile(gl,gl.FRAGMENT_SHADER,PREAMBLE+'\n'+SHADERS[id]+'\n'+EPILOGUE);
    const p=gl.createProgram(); gl.attachShader(p,vs); gl.attachShader(p,fs); gl.linkProgram(p);
    if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    if(program) gl.deleteProgram(program); program=p; gl.useProgram(p);
    gl.bindBuffer(gl.ARRAY_BUFFER,quad); const aPos=gl.getAttribLocation(p,'aPos'); gl.enableVertexAttribArray(aPos); gl.vertexAttribPointer(aPos,2,gl.FLOAT,false,0,0);
    u=setup(gl,p); curId=id; switchCount++; label.innerHTML='switch → '+id+' <span class="ok">#'+switchCount+'</span>'; return true;
  } catch(e){ label.innerHTML='switch <span class="bad">✗ '+id+'</span>'; return false; } }
  build(ids[0]);
  switchDraw=(tSec)=>{ if(!program) return; const w=cvs.clientWidth||320,h=cvs.clientHeight||180; if(cvs.width!==w||cvs.height!==h){cvs.width=w;cvs.height=h;}
    gl.viewport(0,0,w,h); gl.useProgram(program); drawWith(gl,u,curId,w,h,tSec);
    const err=gl.getError(); if(err!==gl.NO_ERROR) label.innerHTML='switch <span class="bad">GL ERROR '+err+'</span>'; };
  setInterval(()=>{ switchIdx=(switchIdx+1)%ids.length; build(ids[switchIdx]); }, 700);
}

document.getElementById('summary').innerHTML =
  `<span class="ok">${pass} passed</span>` + (fail ? ` · <span class="bad">${fail} failed</span>` : ' · all shaders compile') + ' · <span id="switchreport"></span>';

function frame(now){ const t=now/1000; for(const d of draws) d(t); if(switchDraw) switchDraw(t);
  const sr=document.getElementById('switchreport'); if(sr) sr.innerHTML='switch-stress: <span class="ok">'+switchCount+' recompiles on one context, still drawing</span>';
  requestAnimationFrame(frame); }
requestAnimationFrame(frame);
</script>
</body>
</html>
