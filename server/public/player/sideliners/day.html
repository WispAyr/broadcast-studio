<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>SideLiner's — Day board</title>
<link rel="stylesheet" href="css/sl.css">
<style>
  /* Fixtures / results for ONE day. Default: opaque full-frame board (gfx_full), like fixtures.html full=1.
     l3=1: a gfx_l3 band that pages one competition at a time, like scores.html.
     Data: Broadcast Studio /api/datafeeds/sideliners/day/<d>. Honesty rules live in the script. */
  body.full .bgfill { position: absolute; inset: 0; background: var(--hero); }
  body.full .bgfill::after { content: ''; position: absolute; left: -10%; right: 40%; top: 0; bottom: 0; background: rgba(21,20,53,.55); transform: skewX(-15deg); }

  /* ---- rows (both layouts) ---- */
  #rows { display: flex; flex-direction: column; gap: 6px; }
  .row { display: grid; grid-template-columns: 1fr var(--cs) 156px var(--cs) 1fr 200px; align-items: center; column-gap: 18px;
    height: 66px; background: var(--navy-glass); position: relative; padding: 0 16px 0 0; --cs: 50px; }
  .row.local { background: linear-gradient(90deg, rgba(250, 166, 26, .24), var(--navy-glass) 26%, var(--navy-glass) 74%, rgba(250, 166, 26, .24)); }
  .row.local::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 8px; background: var(--amber); }
  .row .crest { box-shadow: 0 0 0 2px rgba(255,255,255,.14); }
  .row .crest.mono { box-shadow: inset 0 0 0 3px rgba(255,255,255,.9); }
  .row .crest.mono span { font-size: calc(var(--cs) * .27); letter-spacing: -.02em; }
  .t { font: italic 700 var(--fs, 38px)/1.1 var(--display); white-space: nowrap; overflow: hidden; min-width: 0; padding: 2px 0 4px; }
  .t.h { text-align: right; padding-left: 30px; } .t.a { text-align: left; }
  .sc { justify-self: center; align-self: stretch; margin: 7px 0; width: 100%; background: #fff; color: var(--navy);
    display: flex; align-items: center; justify-content: center; gap: 12px;
    font: italic 700 calc(var(--fs, 38px) * 1.08)/1 var(--display); font-variant-numeric: tabular-nums; }
  .sc i { font-style: normal; opacity: .35; }
  .sc.ko, .sc.v { background: transparent; color: #fff; box-shadow: inset 0 0 0 2px rgba(255,255,255,.42); }
  .sc.ko { font: 700 calc(var(--fs, 38px) * 1.02)/1 var(--body); letter-spacing: .02em; }
  .sc.v { font: italic 700 calc(var(--fs, 38px) * .8)/1 var(--display); color: rgba(255,255,255,.55); }
  .sc.flash { animation: flash 2.4s ease-out; }
  @keyframes flash { 0%, 40% { background: var(--amber); } 100% { background: #fff; } }
  .st { justify-self: end; min-width: 104px; max-width: 100%; text-align: center; padding: 8px 12px 10px; font: 700 calc(var(--fs, 38px) * .74)/1 var(--body);
    letter-spacing: .04em; font-variant-numeric: tabular-nums; border: 2px solid rgba(255,255,255,.4); color: #fff; white-space: nowrap; overflow: hidden; }
  .st.live { background: var(--red); border-color: var(--red); }
  .st.ht { background: var(--amber); border-color: var(--amber); color: var(--navy); }
  .st.cd, .st.due { border-color: transparent; color: var(--aqua); padding-right: 4px; text-align: right; font-size: calc(var(--fs, 38px) * .9); }
  .st.due { color: var(--amber); }
  .st.pp { border-color: var(--red); color: #fff; }
  .st.upd { border-color: var(--aqua); color: var(--aqua); font-size: calc(var(--fs, 38px) * .6); letter-spacing: .12em; text-transform: uppercase; }
  .st .kt { display: none; }
  .msg { display: flex; align-items: center; gap: 18px; height: 72px; padding: 0 34px; background: var(--navy-glass); border-top: 5px solid var(--amber);
    font: 700 32px/1 var(--body); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-2); }
  .msg.upd { border-top-color: var(--aqua); }
  .msg .dot { color: var(--aqua); }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: currentColor; flex: none; }
  .in .dot { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  .sample { padding: 5px 12px 7px; border: 2px solid var(--aqua); color: var(--aqua);
    font: 700 20px/1 var(--body); letter-spacing: .18em; text-transform: uppercase; white-space: nowrap; }
  /* Page turn: rows wipe off to the right, the next page wipes in from the left */
  .gone .a { clip-path: inset(-20px -40px -20px 100%) !important; transition: clip-path .36s var(--ease-wipe) var(--od, 0s) !important; }
  .pre .a { clip-path: inset(-20px 100% -20px -40px) !important; transition: none !important; }

  /* ---- full board (default) ---- */
  .board { position: absolute; left: 50%; top: 96px; bottom: 96px; width: 1480px; margin-left: -740px; display: flex; flex-direction: column; }
  .head { display: flex; align-items: flex-end; justify-content: space-between; padding-bottom: 18px; border-bottom: 5px solid var(--amber); gap: 30px; }
  .head h1 { margin: 0; font: italic 700 84px/1 var(--display); white-space: nowrap; }
  .head .sub { margin-top: 14px; font: 700 28px/1 var(--body); letter-spacing: .2em; text-transform: uppercase; color: var(--ink-2); }
  .head .hr { display: flex; align-items: flex-end; gap: 20px; padding-bottom: 6px; flex: none; }
  .board #rows { flex: 1; min-height: 0; justify-content: center; gap: var(--gap, 10px); padding-top: 16px; }
  .board .row { height: var(--rh, 74px); --cs: calc(var(--rh, 74px) * .7); }
  .grp { --k: 10px; align-self: flex-start; padding: 7px 20px 9px; margin-top: 10px;
    font: 700 var(--gfs, 24px)/1 var(--body); letter-spacing: .18em; text-transform: uppercase; }
  .foot { display: flex; justify-content: space-between; align-items: center; padding-top: 16px; gap: 24px; }
  .foot img { height: 40px; }
  .legend { font: 700 22px/1 var(--body); letter-spacing: .18em; text-transform: uppercase; color: var(--ink-2); display: flex; align-items: center; gap: 12px; }
  .fr { margin-left: auto; display: flex; align-items: center; gap: 26px; font: 700 22px/1 var(--body); letter-spacing: .18em; text-transform: uppercase; color: var(--ink-2); }
  .pages { display: flex; gap: 8px; }
  .pages b { width: 26px; height: 8px; background: rgba(255,255,255,.25); transform: skewX(-15deg); }
  .pages b.on { background: var(--amber); }
  .board .msg { align-self: center; }

  /* ---- l3=1: band ---- */
  .card { position: absolute; left: 50%; bottom: 100px; width: 1560px; margin-left: -780px; }
  .top { display: flex; align-items: flex-end; height: 58px; }
  #dyn, #compbox { display: flex; align-items: flex-end; min-width: 0; }
  .tag { --k: 14px; --pg: #fff; color: var(--navy); padding: 12px 38px 12px 30px; z-index: 1; display: flex; align-items: center; gap: 14px;
    font: 700 34px/1 var(--body); letter-spacing: .16em; text-transform: uppercase; white-space: nowrap; }
  .tag.upd { --pg: var(--aqua); }
  .comp { --k: 14px; margin-left: -8px; padding: 10px 40px 12px 34px; font: 700 30px/1 var(--body);
    letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; overflow: hidden; max-width: 820px; }
  .comp small { font-size: 22px; letter-spacing: .1em; opacity: .7; margin-left: 14px; }
  .card .sample { margin: 0 18px 10px auto; }
  .top #brand { margin-left: auto; }
  .sample + #brand { margin-left: 0; }
  .card .row:first-child { border-top: 5px solid var(--amber); height: 71px; }
  .prog { height: 4px; background: rgba(255,255,255,.18); }
  .prog b { display: block; height: 100%; width: 0; background: var(--amber); }
  .prog.run b { animation: prog var(--pt, 8s) linear forwards; }
  @keyframes prog { to { width: 100%; } }

  /* ---- Portrait: each match is two lines (home over away), goals in a white column, status on the right.
     Upcoming: KO time over the countdown in the status column. ---- */
  .portrait .row, .portrait .board .row { grid-template-columns: var(--cs) 1fr 84px 170px; grid-template-rows: auto auto; column-gap: 20px; row-gap: 0;
    height: auto !important; padding: 0 0 0 30px; border-top: 2px solid rgba(255,255,255,.12); --cs: 54px; }
  .portrait .row .crest.hc { grid-row: 1; grid-column: 1; margin-top: 10px; }
  .portrait .row .crest.ac { grid-row: 2; grid-column: 1; margin-bottom: 10px; }
  .portrait .t.h { grid-row: 1; grid-column: 2; text-align: left; padding: 14px 0 4px; }
  .portrait .t.a { grid-row: 2; grid-column: 2; padding: 4px 0 14px; }
  .portrait .t { font-size: var(--fs, 44px); }
  .portrait .sc { display: contents; }
  .portrait .g { grid-column: 3; background: #fff; color: var(--navy); align-self: stretch; display: grid; place-items: center;
    font: italic 700 calc(var(--fs, 44px) * 1.1)/1 var(--display); font-variant-numeric: tabular-nums; }
  .portrait .g.h { grid-row: 1; padding-top: 6px; } .portrait .g.a { grid-row: 2; padding-bottom: 6px; }
  .portrait .sc.flash .g { animation: flash 2.4s ease-out; }
  .portrait .sc i { display: none; }
  .portrait .sc.ko .g, .portrait .sc.v .g { background: transparent; }
  .portrait .st { grid-row: 1 / 3; grid-column: 4; justify-self: stretch; margin-right: 16px; min-width: 0; font-size: calc(var(--fs, 44px) * .7); }
  .portrait .st.cd, .portrait .st.due { text-align: center; padding: 6px 0; border: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .portrait .st .kt { display: block; width: 100%; background: #fff; color: var(--navy); padding: 8px 0 10px; font-size: calc(var(--fs, 44px) * .8); }
  .portrait .st.cd .cdt, .portrait .st.due .cdt { font-size: calc(var(--fs, 44px) * .56); white-space: normal; line-height: 1; }
  .portrait .st.upd { white-space: normal; line-height: 1.1; font-size: calc(var(--fs, 44px) * .46); }
  .portrait .row.local::before { width: 8px; }
  .portrait .msg { font-size: 30px; height: 84px; padding: 0 30px; border-top-width: 6px; }
  body.full.portrait .board { left: var(--sx); margin-left: 0; width: var(--sw); top: 290px; bottom: 480px; }
  body.full.portrait .bgfill::after { left: -40%; right: 30%; }
  .portrait .head { flex-direction: column-reverse; align-items: flex-start; gap: 14px; padding-bottom: 20px; border-bottom-width: 6px; }
  .portrait .head h1 { font-size: 78px; line-height: 1.02; white-space: normal; }
  .portrait .head .hr { padding-bottom: 0; width: 100%; }
  .portrait .head .hr #brand { margin-left: auto; }
  .portrait .head .sample { margin: 0 0 12px 0; }
  .portrait .board #rows { justify-content: flex-start; gap: var(--gap, 8px); padding-top: 14px; }
  .portrait .board #rows > :first-child { margin-top: auto; }
  .portrait .board #rows > :last-child { margin-bottom: auto; }
  .portrait .grp { font-size: var(--gfs, 24px); margin-top: 6px; }
  .portrait .foot { flex-wrap: wrap; row-gap: 12px; }
  .portrait .foot img { height: 44px; }
  .portrait .fr { order: 3; flex-basis: 100%; margin-left: 0; justify-content: space-between; }
  .portrait .card { left: var(--sx); margin-left: 0; width: var(--sw); bottom: var(--pb); }
  .portrait .card .top { height: auto; }
  .portrait .card .tag { font-size: 36px; padding: 14px 40px 14px 32px; --k: 16px; }
  .portrait .card .top #brand { margin-bottom: 8px; }
  .portrait .card .sample { margin-bottom: 18px; }
  .portrait .clabel { padding: 18px 30px 14px; background: var(--navy-glass); border-top: 6px solid var(--amber);
    font: 700 28px/1.1 var(--body); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-2); }
  .portrait .clabel small { font-size: 22px; opacity: .8; margin-left: 10px; }
  .portrait .card #rows { gap: 0; }
  .portrait .card .row:first-child { border-top: 2px solid rgba(255,255,255,.12); height: auto; }
</style></head>
<body>
<div class="bgfill a fade"></div>
<div id="root"></div>
<script src="js/sl.js"></script>
<script>
  /* Params
     d=       today (default) | yesterday | tomorrow | YYYY-MM-DD   (Europe/London days)
     feed=    JSON source (default /api/datafeeds/sideliners/day/<d> on Broadcast Studio)
     tier=    1,2 (default) filter on league.tier; tier=all shows every tier     league= <id>[,<id>]
     per=     rows per page (full: 10, portrait 6; l3: 4)      page= seconds per page (8)
     l3=1     lower-third band that pages one competition at a time (gfx_l3). Default is the full-frame board (gfx_full).
     title=   override the title          demo=1  built-in sample day (marked SAMPLE DATA) · demo=stale · demo=empty
   Rows: finished → the score + FT/AET/PENS · live → the score + minute (ONLY while the feed is fresh: stale=false and
   ageSec <= 120, aged locally between polls; otherwise the score comes off and the row says UPDATING) · upcoming → the
   kick-off and a live countdown ("in 2h 14m", "in 42 min", "Due to start" at/after KO until the feed says it is live) ·
   postponed → P-P (cancelled OFF, abandoned ABND). Nothing is predicted. Refresh: 30 s for today, 10 min for other days. */
  var L3 = SL.p('l3') === '1', FULL = !L3, PORT = SL.portrait;
  if (FULL) document.body.classList.add('full');
  var DEMO = SL.p('demo'), D = SL.p('d', 'today');
  var FEED = SL.p('feed', '/api/datafeeds/sideliners/day/' + encodeURIComponent(D));
  var PER = Math.max(1, +SL.p('per', FULL ? (PORT ? 6 : 10) : 4) || 4), PAGE = Math.max(3, +SL.p('page', 8) || 8);
  var TIERS = SL.p('tier', '1,2') === 'all' ? [] : SL.p('tier', '1,2').split(/\s*,\s*/).filter(Boolean).map(Number);
  var LEAGUES = SL.list('league').map(String);
  var MAX_AGE = 120;
  var DATA = null, gotAt = 0, pages = [], pi = 0, cycleT = 0, pollT = 0, emptyT = 0, shown = '', last = {};

  function el(id) { return document.getElementById(id); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  // ---- Europe/London days ----
  var WD = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var MO = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  function ymdLondon(ms) {
    try { return new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/London', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date(ms)); }
    catch (e) { var d = new Date(ms); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  }
  function addDays(ymd, n) { var p = ymd.split('-').map(Number), d = new Date(Date.UTC(p[0], p[1] - 1, p[2] + n)); return d.toISOString().slice(0, 10); }
  function longDate(ymd) { var p = ymd.split('-').map(Number), d = new Date(Date.UTC(p[0], p[1] - 1, p[2])); return WD[d.getUTCDay()] + ' ' + p[2] + ' ' + MO[p[1] - 1]; }
  function today() { return ymdLondon(Date.now()); }
  function wantDate() {
    if (D === 'today') return today(); if (D === 'yesterday') return addDays(today(), -1); if (D === 'tomorrow') return addDays(today(), 1);
    return /^\d{4}-\d{2}-\d{2}$/.test(D) ? D : today();
  }
  function theDate() { return (DATA && /^\d{4}-\d{2}-\d{2}$/.test(DATA.date || '') && DATA.date) || wantDate(); }
  function allDone() { var f = (DATA && DATA.fixtures) || []; return f.length > 0 && f.every(function (x) { return x.finished || x.off; }); }
  function titles() {
    var t = SL.p('title'), dt = theDate();
    if (t) return [t, D === 'today' || D === 'yesterday' || D === 'tomorrow' ? longDate(dt) : ''];
    if (D === 'today') return [allDone() ? "Today's results" : "Today's fixtures", longDate(dt)];
    if (D === 'yesterday') return ["Yesterday's results", longDate(dt)];
    if (D === 'tomorrow') return ["Tomorrow's fixtures", longDate(dt)];
    return [longDate(dt), ''];
  }
  function hhmm(ts) {
    try { return new Date(ts * 1000).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/London' }); }
    catch (e) { var d = new Date(ts * 1000); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  }
  // ---- freshness ----
  function toSec(g) { if (g == null || g === '') return null; if (typeof g === 'number') return g > 1e12 ? g / 1000 : g; var x = Date.parse(g); return isNaN(x) ? null : x / 1000; }
  function age() {
    if (!DATA) return Infinity;
    var base = typeof DATA.ageSec === 'number' ? DATA.ageSec : (toSec(DATA.generated) != null ? gotAt / 1000 - toSec(DATA.generated) : Infinity);
    return base + (Date.now() - gotAt) / 1000;
  }
  function fresh() { return !!DATA && DATA.ok !== false && DATA.stale !== true && age() <= MAX_AGE; }
  // ---- fixture state ----
  function isLocal(f) {
    var h = f.home || {}, a = f.away || {};
    return f.local === 'AYRSHIRE' || h.local === 'AYRSHIRE' || a.local === 'AYRSHIRE' || SL.isAyr(h.name) || SL.isAyr(a.name);
  }
  var LIVE_ST = ['1H', 'HT', '2H', 'ET', 'BT', 'P', 'LIVE', 'SUSP', 'INT'], FIN_ST = ['FT', 'AET', 'PEN'], OFF_ST = ['PST', 'CANC', 'ABD', 'AWD', 'WO'];
  function kind(f) {
    var s = String(f.status || '').toUpperCase();
    if (f.finished === true || FIN_ST.indexOf(s) !== -1) return 'fin';
    if (f.off === true || OFF_ST.indexOf(s) !== -1) return 'off';
    if (f.live === true || LIVE_ST.indexOf(s) !== -1) return 'live';
    return 'ns';
  }
  function goals(f) { var h = f.home && f.home.goals, a = f.away && f.away.goals; return h == null || a == null ? null : [h, a]; }
  function countdown(ts) {        // "in 2h 14m" · "in 42 min" · "Due to start"
    var s = ts - Date.now() / 1000;
    if (s <= 0) return null;
    var m = Math.ceil(s / 60);
    if (m < 60) return 'in ' + m + ' min';
    var h = Math.floor(m / 60);
    if (h >= 24) return 'in ' + Math.floor(h / 24) + 'd ' + (h % 24) + 'h';
    return 'in ' + h + 'h ' + (m % 60) + 'm';
  }
  // Centre cell + status chip for a fixture, by state
  function cells(f) {
    var k = kind(f), g = goals(f), s = String(f.status || '').toUpperCase(), e = f.elapsed, x = f.extra;
    var min = e != null && e !== '' ? e + (x ? '+' + x : '') + "'" : '';
    var sc = function (cls, a, b) {
      return PORT ? '<span class="sc ' + cls + '" data-sc><span class="g h">' + a + '</span><span class="g a">' + b + '</span></span>'
                  : '<span class="sc ' + cls + '" data-sc>' + (b === '' ? a : a + '<i>–</i>' + b) + '</span>';
    };
    var ko = f.ts ? hhmm(f.ts) : 'TBC';
    if (k === 'fin') return [g ? sc('', g[0], g[1]) : sc('v', 'v', ''), '<span class="st" data-st>' + (s === 'AET' ? 'AET' : s === 'PEN' ? 'PENS' : 'FT') + '</span>'];
    if (k === 'off') return [sc('v', PORT ? '' : 'v', ''), '<span class="st pp" data-st>' + (s === 'CANC' ? 'OFF' : s === 'ABD' ? 'ABND' : s === 'AWD' || s === 'WO' ? 'AWD' : 'P-P') + '</span>'];
    if (k === 'live') {
      if (!fresh()) return [PORT ? sc('ko', '', '') : sc('ko', SL.esc(ko), ''), '<span class="st upd" data-st>Updating</span>'];
      var c = s === 'HT' ? ['HT', 'ht'] : s === 'BT' ? ['ET BRK', 'ht'] : s === 'P' ? ['PENS', 'live'] : s === 'SUSP' || s === 'INT' ? [s, 'ht'] : [min || 'LIVE', 'live'];
      return [g ? sc('', g[0], g[1]) : sc('v', 'v', ''), '<span class="st ' + c[1] + '" data-st>' + SL.esc(c[0]) + '</span>'];
    }
    var cd = f.ts ? countdown(f.ts) : null;
    return [PORT ? sc('ko', '', '') : sc('ko', SL.esc(ko), ''),
      '<span class="st ' + (cd || !f.ts ? 'cd' : 'due') + '" data-st' + (f.ts ? ' data-ko="' + f.ts + '"' : '') + '><span class="kt">' + SL.esc(ko) + '</span><span class="cdt">' +
      (f.ts ? SL.esc(cd || 'Due to start') : 'KO TBC') + '</span></span>'];
  }
  function keep(f) {
    var L = f.league || {};
    if (TIERS.length && TIERS.indexOf(+L.tier) === -1) return false;
    if (LEAGUES.length && LEAGUES.indexOf(String(L.id)) === -1) return false;
    return true;
  }
  function list() { return ((DATA && DATA.fixtures) || []).filter(keep); }
  function paginate(fx) {
    var groups = [], by = {};
    fx.forEach(function (f, i) {
      var L = f.league || {}, key = L.id != null ? L.id : L.name;
      if (!by[key]) { by[key] = { name: L.name || '', tier: L.tier == null ? 99 : +L.tier, items: [] }; groups.push(by[key]); }
      by[key].items.push(f);
    });
    // Scottish tiers first (lowest tier number), then by name; in a group, by kick-off
    groups.sort(function (a, b) { return a.tier - b.tier || (a.name < b.name ? -1 : a.name > b.name ? 1 : 0); });
    groups.forEach(function (g) { g.items.sort(function (a, b) { return (a.ts || 0) - (b.ts || 0) || String((a.home || {}).name).localeCompare(String((b.home || {}).name)); }); });
    var out = [];
    if (L3) {
      groups.forEach(function (g) {
        var n = Math.ceil(g.items.length / PER);
        for (var p = 0; p < n; p++) out.push({ groups: [{ name: g.name, part: n > 1 ? (p + 1) + '/' + n : '', items: g.items.slice(p * PER, (p + 1) * PER) }] });
      });
    } else {
      var cur = null, count = 0;
      groups.forEach(function (g) {
        // keep a small group together on one page rather than stranding one or two rows
        if (cur && count + Math.min(g.items.length, 3) > PER) cur = null;
        for (var i = 0; i < g.items.length; i++) {
          if (!cur || count >= PER) { cur = { groups: [] }; out.push(cur); count = 0; }
          var lg = cur.groups[cur.groups.length - 1];
          if (!lg || lg.src !== g) { lg = { name: g.name, part: '', src: g, items: [] }; cur.groups.push(lg); }
          lg.items.push(g.items[i]); count++;
        }
      });
    }
    return out;
  }

  function rowHtml(f, i) {
    var h = f.home || {}, a = f.away || {}, c = cells(f);
    var d = ' style="--d:' + (.12 + i * .06).toFixed(2) + 's;--od:' + (i * .03).toFixed(2) + 's"';
    var hc = SL.crest(h.logo, h.name).replace('class="crest', 'class="crest hc'), ac = SL.crest(a.logo, a.name).replace('class="crest', 'class="crest ac');
    return '<div class="row a wipe' + (isLocal(f) ? ' local' : '') + '" data-id="' + SL.esc(f.id) + '"' + d + '>' +
      '<span class="t h">' + SL.esc(h.name) + '</span>' + hc + c[0] + ac + '<span class="t a">' + SL.esc(a.name) + '</span>' + c[1] + '</div>';
  }
  function msgHtml(kind, text) {
    return '<div class="msg a wipe' + (kind === 'upd' ? ' upd' : '') + '" style="--d:.15s">' + (kind === 'upd' ? '<span class="dot"></span>' : '') + SL.esc(text) + '</div>';
  }
  function sample() { return DEMO ? '<span class="sample a fade" style="--d:.5s">Sample data</span>' : ''; }

  // ---- layout shells ----
  if (L3) {
    el('root').innerHTML = '<div class="card"><div class="top"><div id="dyn"></div><div id="compbox"></div>' + sample() +
      '<span class="a rise" id="brand" style="--d:.5s">' + SL.wordmark(PORT ? 64 : 52) + '</span></div>' +
      (PORT ? '<div id="clabel"></div>' : '') + '<div id="rows"></div><div class="prog a fade" id="prog" style="--d:.6s"><b></b></div></div>';
  } else {
    el('root').innerHTML = '<div class="board"><div class="head a wipe" style="--d:.05s"><div style="min-width:0"><h1 id="h1"></h1><div class="sub" id="sub"></div></div>' +
      '<div class="hr">' + sample() + '<span id="brand">' + SL.wordmark(64) + '</span></div></div>' +
      '<div id="rows"></div><div class="foot a fade" style="--d:.9s"><span class="legend" id="legend"><span class="ayr">Ayrshire</span> Ayrshire clubs highlighted</span>' +
      '<span class="fr"><span class="pages" id="pages"></span><span id="updAt"></span></span><img src="logo/nar-long-white.svg" alt="Now Ayrshire Radio"></div></div>';
  }

  function state() {
    if (!DATA || DATA.ok === false) return { mode: 'updating' };
    var fx = list();
    return fx.length ? { mode: 'ok', list: fx } : { mode: 'empty' };
  }
  function paint(view, anim) {
    var tt = titles(), dyn = '', rows = '', clabel = '', comp = '';
    if (view.mode === 'ok') {
      var pg = view.page, i = 0;
      pg.groups.forEach(function (g) {
        if (FULL) rows += '<div class="grp pg a wipe" style="--d:' + (.12 + i * .06).toFixed(2) + 's">' + SL.esc(g.name) + '</div>';
        g.items.forEach(function (f) { rows += rowHtml(f, i++); });
      });
      var g0 = pg.groups[0], part = g0.part ? '<small>' + g0.part + '</small>' : '';
      if (L3 && !PORT) comp = '<div class="comp pg a wipe" style="--d:.1s;--od:.05s">' + SL.esc(g0.name) + part + '</div>';
      if (L3 && PORT) clabel = '<div class="clabel a wipe" style="--d:.1s;--od:.05s">' + SL.esc(g0.name) + part + '</div>';
    } else if (view.mode === 'updating') rows = msgHtml('upd', 'Fixtures updating');
    else rows = msgHtml('', 'No matches');
    if (L3) dyn = '<div class="tag pg a wipe-up' + (view.mode === 'updating' ? ' upd' : '') + '" style="--d:.1s;--od:.1s">' + SL.esc(tt[0]) + '</div>';
    var key = dyn + comp + clabel + rows;
    if (key === shown) return;
    var parts = [['dyn', dyn], ['compbox', comp], ['clabel', clabel], ['rows', rows]].filter(function (x) { return el(x[0]); });
    var targets = parts.filter(function (x) { return anim === 'pre' || last[x[0]] !== x[1]; }).map(function (x) { return el(x[0]); });
    var apply = function () {
      parts.forEach(function (x) { if (last[x[0]] !== x[1]) { el(x[0]).innerHTML = x[1]; last[x[0]] = x[1]; } });
      if (FULL) {
        el('h1').textContent = tt[0]; el('sub').textContent = tt[1]; el('sub').style.display = tt[1] ? '' : 'none';
        el('legend').style.visibility = el('rows').querySelector('.row.local') ? '' : 'hidden';
        el('pages').innerHTML = pages.length > 1 ? pages.map(function (p, k) { return '<b' + (k === pi ? ' class="on"' : '') + '></b>'; }).join('') : '';
        var up = toSec(DATA && DATA.generated); el('updAt').textContent = up ? 'Updated ' + hhmm(up) : '';
      }
      fit(); shown = key;
    };
    if (anim === 'pre') {
      apply();
      targets.forEach(function (t) { t.classList.add('pre'); }); void document.body.offsetWidth;
      targets.forEach(function (t) { t.classList.remove('pre'); });
    } else if (anim && shown && document.body.classList.contains('in')) {
      targets.forEach(function (t) { t.classList.add('gone'); });
      setTimeout(function () {
        apply();
        targets.forEach(function (t) { t.classList.remove('gone'); t.classList.add('pre'); });
        void document.body.offsetWidth;
        targets.forEach(function (t) { t.classList.remove('pre'); });
      }, 400);
    } else apply();
  }
  // Height the content actually needs (scrollHeight can't see overflow above a centred flex column)
  function used(box) {
    var k = box.children; if (!k.length) return 0;
    var f = k[0], l = k[k.length - 1], cs = getComputedStyle(box);
    return l.offsetTop + l.offsetHeight + parseFloat(getComputedStyle(l).marginBottom) - f.offsetTop + parseFloat(getComputedStyle(f).marginTop) +
      parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  }
  function fit() {
    var rows = el('rows'), s = document.body.style;
    if (FULL && !PORT) {
      var n = rows.querySelectorAll('.row').length + rows.querySelectorAll('.grp').length;
      var rh = Math.max(50, Math.min(84, Math.floor(700 / Math.max(n, 6)) - 10));
      s.setProperty('--rh', rh + 'px'); s.setProperty('--fs', Math.round(rh * .5) + 'px');
      s.setProperty('--gfs', Math.max(18, Math.round(rh * .32)) + 'px'); s.setProperty('--gap', (rh > 60 ? 10 : 6) + 'px');
      // then tighten until the page clears the foot with air to spare
      while (rh > 44 && used(rows) > rows.clientHeight - 16) {
        rh -= 2; s.setProperty('--rh', rh + 'px'); s.setProperty('--fs', Math.round(rh * .5) + 'px'); s.setProperty('--gap', '6px');
      }
    } else if (FULL && PORT) {
      for (var fs = 50; fs >= 28; fs -= 2) {
        s.setProperty('--fs', fs + 'px'); s.setProperty('--gfs', Math.max(20, Math.round(fs * .55)) + 'px'); s.setProperty('--gap', Math.round(fs * .16) + 'px');
        if (rows.scrollHeight <= rows.clientHeight + 1) break;
      }
    }
    rows.querySelectorAll('.t').forEach(function (t) { SL.shrink(t, PORT ? 28 : 24); });
    rows.querySelectorAll('.st:not(.cd):not(.due)').forEach(function (t) { SL.shrink(t, 16); });
    SL.shrink(document.querySelector('.comp'), 22);
    var h1 = el('h1'); if (h1) (PORT ? SL.fitLines(h1, 2, 48) : SL.shrink(h1, 48));
  }
  function view(i) {
    var st = state();
    if (st.mode !== 'ok') { pages = []; return st; }
    pages = paginate(st.list);
    return { mode: 'ok', page: pages[i % pages.length] };
  }
  function show(anim) {
    var v = view(pi);
    if (v.mode === 'ok') pi = pi % pages.length;
    paint(v, anim);
    clearTimeout(emptyT);
    // As an l3 overlay an empty day steps aside after 5 s; the full board stays up saying so
    if (v.mode === 'empty' && L3 && SL.on && SL.p('static') !== '1') emptyT = setTimeout(function () { stopAll(); SL.stop(); }, 5000);
    progress(v.mode === 'ok' && pages.length > 1);
  }
  function progress(on) {
    var p = el('prog'); if (!p) return;
    p.style.visibility = on && SL.p('static') !== '1' ? '' : 'hidden';
    p.classList.remove('run'); void p.offsetWidth;
    if (on && SL.on && SL.p('static') !== '1') { p.style.setProperty('--pt', PAGE + 's'); p.classList.add('run'); }
  }
  // Rows on the visible page update in place between page turns (score flash in amber)
  function patch() {
    if (!pages.length) return;
    var all = {}; list().forEach(function (f) { all[f.id] = f; });
    document.querySelectorAll('.row[data-id]').forEach(function (r) {
      var f = all[r.dataset.id]; if (!f) return;
      var tmp = document.createElement('div'); tmp.innerHTML = rowHtml(f, 0);
      var n = tmp.firstChild, sc = r.querySelector('[data-sc]'), nsc = n.querySelector('[data-sc]');
      if (sc && nsc && (sc.innerHTML !== nsc.innerHTML || sc.className !== nsc.className)) {
        var scoreChange = sc.className === nsc.className && !/\b(ko|v)\b/.test(nsc.className);
        sc.outerHTML = nsc.outerHTML; if (scoreChange) r.querySelector('[data-sc]').classList.add('flash');
      }
      var st = r.querySelector('[data-st]'), nst = n.querySelector('[data-st]');
      if (st && nst && st.outerHTML !== nst.outerHTML) st.outerHTML = nst.outerHTML;
    });
  }
  // Countdowns tick every second (and turn into "Due to start" at kick-off)
  setInterval(function () {
    document.querySelectorAll('[data-ko]').forEach(function (e) {
      var cd = countdown(+e.dataset.ko), t = e.querySelector('.cdt'), txt = cd || 'Due to start';
      if (t && t.textContent !== txt) { t.textContent = txt; e.className = 'st ' + (cd ? 'cd' : 'due'); }
    });
  }, 1000);
  function turn() { pi++; show(true); }
  function startCycle() { clearInterval(cycleT); pi = 0; show('pre'); cycleT = setInterval(turn, PAGE * 1000); }
  function stopAll() { clearInterval(cycleT); }

  // ---- data ----
  function demoData() {
    var t = Math.floor(Date.now() / 1000), dt = wantDate();
    function fx(id, lg, h, a, hg, ag, st, e, ts) {
      var fin = FIN_ST.indexOf(st) !== -1, off = OFF_ST.indexOf(st) !== -1;
      return { id: id, ts: ts, league: lg, status: st, elapsed: e, live: !fin && !off && st !== 'NS', finished: fin, off: off,
        home: { name: h, logo: '', goals: hg, local: SL.isAyr(h) ? 'AYRSHIRE' : 'SCOTTISH' },
        away: { name: a, logo: '', goals: ag, local: SL.isAyr(a) ? 'AYRSHIRE' : 'SCOTTISH' }, scorers: [], local: SL.isAyr(h) || SL.isAyr(a) ? 'AYRSHIRE' : null };
    }
    var P = { id: 179, name: 'Scottish Premiership', tier: 1 }, C = { id: 180, name: 'Scottish Championship', tier: 2 }, L1 = { id: 183, name: 'Scottish League One', tier: 3 };
    // sample kick-offs stay inside the sample day, whatever time the still is rendered
    var eod = Date.parse(dt + 'T23:59:00Z') / 1000 - 3600, room = Math.max(300, eod - t);
    var done = t - 3 * 3600, live = t - 64 * 60, soon = t + Math.min(42 * 60 + 20, room / 3), later = t + Math.min(2 * 3600 + 14 * 60 + 20, room * .8), due = t - 3 * 60;
    var d = { ok: true, date: dt, generated: new Date().toISOString(), stale: DEMO === 'stale', ageSec: DEMO === 'stale' ? 600 : 6, fixtures: [
      fx(1, P, 'Kilmarnock', 'Celtic', 2, 1, '2H', 67, live), fx(2, P, 'Hearts', 'Aberdeen', 0, 0, 'HT', 45, live),
      fx(3, P, 'St Mirren', 'Dundee', 1, 0, 'FT', 90, done), fx(4, P, 'Rangers', 'Motherwell', null, null, 'NS', null, soon),
      fx(5, P, 'Dundee United', 'Hibernian', null, null, 'NS', null, later),
      fx(6, C, 'Ayr United', 'Inverness Caledonian Thistle', 1, 1, '2H', 58, live), fx(7, C, 'Raith Rovers', 'Greenock Morton', 3, 2, 'FT', 90, done),
      fx(8, C, "Queen's Park", 'Airdrieonians', null, null, 'PST', null, later), fx(9, C, 'Partick Thistle', 'Falkirk', null, null, 'NS', null, due),
      fx(10, L1, 'Cove Rangers', 'Kelty Hearts', 0, 2, 'FT', 90, done)] };
    if (DEMO === 'empty') d.fixtures = [];
    return d;
  }
  // A relative board (today/yesterday/tomorrow) only accepts data for the date it means here,
  // in London; anything else (a server whose idea of "today" is off) shows as updating.
  function take(d) { if (d && d.date && /^(today|yesterday|tomorrow)$/.test(D) && d.date !== wantDate()) d = { ok: false }; DATA = d; gotAt = Date.now(); }
  function every() { return wantDate() === today() ? 30000 : 600000; }
  function poll(first) {
    clearTimeout(pollT);
    var p = DEMO ? Promise.resolve(demoData()).then(take)
      : fetch(FEED, { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(take).catch(function () { /* keep the last copy; live rows age out on their own */ });
    return p.then(function () {
      pollT = setTimeout(function () { poll(false); }, every());
      if (first) return;
      if (state().mode !== 'ok' || !pages.length) show(true);
      else { view(pi); patch(); }
    });
  }
  // Freshness is re-checked every few seconds: a live score never outlives a stale feed
  setInterval(function () { if (SL.on && pages.length) patch(); }, 3000);

  document.addEventListener('sl:in', function () { if (SL.p('static') === '1') { shown = ''; show(false); return; } startCycle(); });
  document.addEventListener('sl:out', function () { stopAll(); clearTimeout(emptyT); });

  var booted = false;
  function boot() { if (booted) return; booted = true; show(false); SL.boot(); }
  if (document.fonts) document.fonts.ready.then(function () { if (el('rows').innerHTML) fit(); });
  setTimeout(boot, 4000);
  poll(true).then(boot);
</script>
