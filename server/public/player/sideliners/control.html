<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SideLiner's GFX</title>
<style>
  @font-face { font-family: 'MuseoModerno'; src: url(fonts/MuseoModerno-BoldItalic.ttf); font-weight: 700; font-style: italic; }
  @font-face { font-family: 'Darker Grotesque'; src: url(fonts/DarkerGrotesque-var.ttf); font-weight: 300 900; }
  :root { --navy: #151435; --panel: #1d1c44; --line: rgba(255,255,255,.12); --amber: #FAA61A; --purple: #7B3B8E; --ink: #e9e8f5; --ink2: #a3a2c4; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--navy); color: var(--ink); font: 15px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; }
  header { display: flex; align-items: center; gap: 14px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font: italic 700 26px/1 'MuseoModerno'; } header h1 b { color: var(--amber); font-weight: 700; }
  header span { color: var(--ink2); font: 700 15px 'Darker Grotesque'; letter-spacing: .12em; text-transform: uppercase; }
  main { display: grid; grid-template-columns: 220px minmax(300px, 420px) 1fr; gap: 0; min-height: calc(100vh - 60px); }
  nav { border-right: 1px solid var(--line); padding: 10px; display: flex; flex-direction: column; gap: 4px; }
  nav button { text-align: left; background: none; border: 0; color: var(--ink); padding: 10px 12px; border-radius: 6px; font: inherit; cursor: pointer; }
  nav button small { display: block; color: var(--ink2); font-size: 12px; }
  nav button.on { background: var(--panel); box-shadow: inset 3px 0 0 var(--amber); }
  form { padding: 18px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px; }
  label { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--ink2); }
  input, select, textarea { font: inherit; color: var(--ink); background: #0f0e2a; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
  textarea { min-height: 150px; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  .hint { font-size: 12px; color: var(--ink2); margin: -6px 0 0; }
  .right { padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .stage { position: relative; width: 100%; aspect-ratio: 16 / 9; background: repeating-conic-gradient(#2a2a33 0 25%, #22222a 0 50%) 0 0 / 24px 24px; border-radius: 8px; overflow: hidden; }
  .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .stage.portrait { aspect-ratio: 9 / 16; width: auto; height: min(72vh, 900px); align-self: flex-start; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 9px 14px; font: 600 14px system-ui; cursor: pointer; }
  .btn.go { background: var(--amber); color: var(--navy); border-color: transparent; }
  .btn.out { background: #3a1b2c; }
  .out-box { background: #0f0e2a; border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
  .out-box h3 { margin: 0 0 6px; font: 800 13px 'Darker Grotesque', sans-serif; letter-spacing: .16em; text-transform: uppercase; color: var(--amber); }
  .out-box code { display: block; word-break: break-all; font: 12px/1.5 ui-monospace, Menlo, monospace; color: var(--ink); }
  .out-box .row { margin-top: 8px; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--amber); color: var(--navy); padding: 8px 16px; border-radius: 6px; font-weight: 700; opacity: 0; transition: opacity .2s; }
  .toast.show { opacity: 1; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; } nav { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); } nav button { flex: none; } form { border-right: 0; } }
</style></head>
<body>
<header><img src="logo/sideliners-bar.png" alt="SideLiner's" style="height:40px"><span>Graphics control</span></header>
<main>
  <nav id="nav"></nav>
  <form id="form" onsubmit="return false"></form>
  <section class="right">
    <div class="stage"><iframe id="pv" title="Preview"></iframe></div>
    <div class="row">
      <button class="btn go" id="bIn">▶ Play in</button>
      <button class="btn out" id="bOut">■ Play out</button>
      <label style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" id="bgStudio" checked> studio backdrop (preview only)</label>
      <label style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" id="pvPortrait"> portrait 9:16</label>
      <label style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" id="pvGuides"> safe zones</label>
    </div>
    <div class="out-box">
      <h3>Broadcast Studio — overlay (Deck / console button: push_overlay)</h3>
      <code id="bsJson"></code>
      <div class="row"><button class="btn" data-copy="bsJson">Copy payload</button>
        <span class="hint" id="bsRemove"></span></div>
    </div>
    <div class="out-box">
      <h3>URL — BS web_source module · OBS browser source (1920×1080)</h3>
      <code id="url"></code>
      <div class="row"><button class="btn" data-copy="url">Copy URL</button><a class="btn" id="open" target="_blank" rel="noopener">Open ↗</a></div>
    </div>
  </section>
</main>
<div class="toast" id="toast">Copied</div>
<script>
  // slot = the BS overlay type. One graphic per slot is on screen at a time; pushing
  // the same slot again replaces it. Lower thirds and straps share gfx_l3 on purpose.
  var G = [
    { id: 'lower-third', name: 'Lower third', sub: 'Name + role', slot: 'gfx_l3', dur: 8, f: [
      ['name', 'Name', 'Scott Watson'], ['role', 'Role', 'Presenter'],
      ['type', 'Style', 'presenter', ['presenter', 'guest', 'caller']] ] },
    { id: 'strap', name: 'Topic strap', sub: 'Tag + headline', slot: 'gfx_l3', dur: 12, f: [
      ['tag', 'Tag', 'Preview'], ['t', 'Headline', 'Can Killie keep the run going at Rugby Park?'], ['s', 'Sub-line (optional)', ''] ] },
    { id: 'fixture', name: 'Match card', sub: 'Home v Away preview', slot: 'gfx_l3', dur: 12, f: [
      ['h', 'Home team', 'Kilmarnock'], ['a', 'Away team', 'Celtic'], ['comp', 'Competition', 'Scottish Premiership'],
      ['ko', 'Kick-off', '3pm'], ['v', 'Venue', 'Rugby Park'], ['day', 'Day (optional)', ''],
      ['hc', 'Home crest image URL (optional)', ''], ['ac', 'Away crest image URL (optional)', ''],
      ['hcol', 'Home monogram colour (optional)', ''], ['acol', 'Away monogram colour (optional)', ''],
      ['ayr', 'Ayrshire flag', '', ['', 'home', 'away', 'both', 'none']] ],
      hint: 'Ayrshire flag is automatic for Ayrshire clubs; override only if needed.' },
    { id: 'fixtures', name: 'Fixtures board', sub: 'Up to ~14 matches', slot: 'gfx_full', dur: 0, f: [
      ['t', 'Title', "Saturday's fixtures"], ['s', 'Sub-line (optional)', ''],
      ['f', 'Fixtures — one per line: Home | Away | KO | Competition', 'Kilmarnock|Celtic|15:00|Scottish Premiership\nAyr United|Partick Thistle|15:00|Scottish Championship', 'area'],
      ['full', 'Backdrop', '1', ['1', '0']] ], hint: 'Backdrop 1 = full-frame graphic; 0 = floats over camera.' },
    { id: 'teamnews', name: 'Team news', sub: 'Out / doubtful / back', slot: 'gfx_side', dur: 0, f: [
      ['team', 'Team', 'Kilmarnock'], ['out', 'Out (comma-separated, "Name: reason")', ''],
      ['doubt', 'Doubtful', ''], ['back', 'Available again', ''],
      ['src', 'Source — shown on air', ''], ['crest', 'Crest image URL (optional)', ''], ['col', 'Monogram colour (optional)', ''],
      ['side', 'Side of frame', 'right', ['right', 'left']] ],
      hint: 'Team news is someone else\'s claim. Fill in Source before it goes to air.' },
    { id: 'goal', name: 'Goal flash', sub: 'GOAL / ruled out / update', slot: 'gfx_l3', dur: 10, f: [
      ['mode', 'Mode', 'goal', ['goal', 'cancelled', 'update']],
      ['h', 'Home team', 'Kilmarnock'], ['a', 'Away team', 'Celtic'],
      ['hs', 'Home score (after the goal)', '1'], ['as', 'Away score (after the goal)', '0'],
      ['side', 'Who scored', 'home', ['home', 'away']], ['scorer', 'Scorer (leave empty if not confirmed)', ''],
      ['min', 'Minute', ''], ['gt', 'Goal type', '', ['', 'Normal Goal', 'Penalty', 'Own Goal']],
      ['comp', 'Competition', 'Scottish Premiership'], ['tag', 'Tag override (e.g. SCORE CORRECTION)', ''],
      ['hc', 'Home crest image URL (optional)', ''], ['ac', 'Away crest image URL (optional)', ''] ],
      hint: 'Scores are the score AFTER the goal. For "cancelled", enter the corrected score and the side whose goal was ruled out. An empty scorer shows "Kilmarnock score" — never guess a name.' },
    { id: 'result', name: 'Result / score card', sub: 'FT, HT or live', slot: 'gfx_l3', dur: 12, f: [
      ['h', 'Home team', 'Kilmarnock'], ['a', 'Away team', 'Celtic'], ['hs', 'Home score', '0'], ['as', 'Away score', '0'],
      ['st', 'Status: FT, HT, AET, PEN, or a minute (67\') / live status (1H, 2H)', 'FT'],
      ['comp', 'Competition', 'Scottish Premiership'],
      ['hsc', 'Home scorers — ;-separated, e.g. Anderson 23\';Watt 67\' (pen)', ''], ['asc', 'Away scorers', ''],
      ['pens', 'Shoot-out score (optional, e.g. 4-3)', ''],
      ['hc', 'Home crest image URL (optional)', ''], ['ac', 'Away crest image URL (optional)', ''] ],
      hint: 'A minute or live status makes it a LIVE card — it never says full-time until you set FT/AET/PEN. Empty scorer lists are left off.' },
    { id: 'scores', name: 'Live scores', sub: 'Ticker / board (live data)', slot: 'gfx_l3', fullSlot: 'gfx_full', dur: 0, pv: { demo: '1' }, f: [
      ['set', 'Matches', 'live', ['live', 'results', 'all']], ['full', 'Layout', '0', ['0', '1']],
      ['tier', 'Tiers (e.g. 1,2 — empty = all)', ''], ['league', 'League id filter (optional)', ''],
      ['per', 'Matches per page (optional)', ''], ['page', 'Seconds per page', '7'], ['title', 'Title override (optional)', ''] ],
      hint: 'Layout 0 = lower-third band (gfx_l3), 1 = full-frame board (gfx_full). Data: BS /api/datafeeds/sideliners/public, every 15 s. The preview uses sample data (demo=1); the copied URL/payload does not. If the feed is stale the page shows SCORES UPDATING instead of scores.' },
    { id: 'table', name: 'League table', sub: 'Standings (live data)', slot: 'gfx_side', fullSlot: 'gfx_full', dur: 0, pv: { demo: '1' }, f: [
      ['league', 'League', '179', ['179', '180', '183', '184']], ['rows', 'Rows', '12'], ['hl', 'Highlight team (optional)', 'Kilmarnock'],
      ['form', 'Form (last 5)', '0', ['0', '1']], ['full', 'Layout', '0', ['0', '1']], ['title', 'Title override (optional)', ''] ],
      hint: '179 Premiership · 180 Championship · 183 League One · 184 League Two. Layout 0 = side panel (gfx_side), 1 = full-frame (gfx_full). The preview uses sample data (demo=1); the copied URL/payload does not.' },
    { id: 'day', name: 'Day board', sub: 'One day\'s fixtures (live data)', slot: 'gfx_full', l3Slot: 'gfx_l3', dur: 0, pv: { demo: '1' }, f: [
      ['d', 'Day: today, yesterday, tomorrow or YYYY-MM-DD', 'today'], ['l3', 'Layout', '0', ['0', '1']],
      ['tier', 'Tiers (1,2 default; "all" = every tier)', '1,2'], ['league', 'League id filter (optional)', ''],
      ['per', 'Rows per page (optional)', ''], ['page', 'Seconds per page', '8'], ['title', 'Title override (optional)', ''] ],
      hint: 'Layout 0 = full-frame board (gfx_full), 1 = lower-third band that pages one competition at a time (gfx_l3). Finished: FT score. Live: score + minute, only while the feed is fresh (otherwise UPDATING). Upcoming: kick-off + countdown. Postponed: P-P. Data: BS /api/datafeeds/sideliners/day/<d>, every 30 s for today, 10 min otherwise. The preview uses sample data (demo=1); the copied URL/payload does not.' },
    { id: 'week', name: 'This week\'s results', sub: 'Results by day (live data)', slot: 'gfx_full', dur: 0, pv: { demo: '1' }, f: [
      ['days', 'Days back', '7'], ['tier', 'Tiers (1,2 default; "all" = every tier)', '1,2'], ['league', 'League id filter (optional)', ''],
      ['page', 'Seconds per page', '8'], ['per', 'Rows per page (optional)', ''], ['title', 'Kicker override (optional)', ''] ],
      hint: 'Full-frame (gfx_full). One page per day per competition, newest first; Ayrshire clubs highlighted. Finished and postponed matches only. Data: BS /api/datafeeds/sideliners/week. The preview uses sample data (demo=1); the copied URL/payload does not.' },
    { id: 'clock', name: 'Studio clock', sub: 'Wall TV clock (server time)', slot: 'gfx_full', dur: 0, pv: { demo: '1' }, f: [
      ['show', 'Show panel (ON AIR / next show / first kick-off)', '1', ['1', '0']], ['ticker', 'Scores ticker', '1', ['1', '0']],
      ['seconds', 'Seconds ring', '1', ['1', '0']], ['tier', 'Ticker tiers (optional, e.g. 1,2)', ''], ['league', 'Ticker league id filter (optional)', ''] ],
      hint: 'Full-frame for the studio wall TV. Time comes from BS /api/time (5 samples, lowest RTT, RTT/2 corrected; an offset over 30 s is rejected) and resyncs every 10 min. The badge under the time says SYNCED or LOCAL. All times Europe/London; the show is Saturdays 10:00-14:00. The ticker only shows live scores while the feed is fresh, otherwise the next kick-offs today, otherwise nothing. The preview uses sample data (demo=1).' },
    { id: 'countdown', name: 'Kick-off countdown', sub: 'Counts to KO', slot: 'gfx_corner', dur: 0, f: [
      ['m', 'Match', 'Kilmarnock v Celtic'], ['to', 'Kick-off (HH:MM today, or ISO date-time)', '15:00'] ] },
    { id: 'contact', name: 'Get involved', sub: 'How to reach the show', slot: 'gfx_l3', dur: 12, f: [
      ['t', 'Headline', 'Get involved'], ['wa', 'Text / WhatsApp number', ''], ['soc', 'Social handle', ''], ['web', 'Website', 'nowayrshireradio.co.uk'] ],
      hint: 'Only filled-in items are shown.' },
    { id: 'bug', name: 'Corner bug', sub: 'Brand + clock', slot: 'gfx_bug', dur: 0, f: [
      ['clock', 'Clock', '1', ['1', '0']], ['live', 'LIVE pill', '0', ['0', '1']], ['nar', 'NAR logo', '1', ['1', '0']] ] },
    { id: 'slate', name: 'Holding slate', sub: 'Full-frame', slot: 'gfx_full', dur: 0, f: [
      ['m', 'Mode', 'soon', ['soon', 'break', 'back', 'end', 'custom']], ['k', 'Kicker (optional override)', ''],
      ['t', 'Headline (optional override)', ''], ['s', 'Sub-line (optional override)', ''], ['spon', 'Sponsor line', 'Sponsored by Kilmarnock Football Club'], ['clock', 'Clock', '1', ['1', '0']] ] },
    { id: 'open', name: 'Show open', sub: 'Animated title', slot: 'gfx_full', dur: 6, f: [
      ['tag', 'Tagline', 'Saturdays 10am–2pm'], ['spon', 'Sponsor line', 'Sponsored by Kilmarnock Football Club'] ] }
  ];

  // The show's crew: show page (Scott, Elliot) + members/evan-warrander (presenter)
  var PRESETS = [{ name: 'Scott Watson', role: 'Presenter', type: 'presenter' }, { name: 'Evan Warrander', role: 'Presenter', type: 'presenter' }, { name: 'Elliot Boyce', role: 'DJ', type: 'presenter' }];
  document.addEventListener('click', function (e) {
    var i = e.target.dataset && e.target.dataset.preset; if (i == null) return;
    var pr = PRESETS[+i]; vals['lower-third'] = Object.assign(vals['lower-third'] || {}, pr); save(); form(); render(true);
  });
  var base = location.href.replace(/[^/]*([?#].*)?$/, '');
  var cur = G[0], vals = {};
  try { vals = JSON.parse(localStorage.getItem('sl-gfx') || '{}'); } catch (e) {}
  function save() { try { localStorage.setItem('sl-gfx', JSON.stringify(vals)); } catch (e) {} }
  function el(id) { return document.getElementById(id); }

  function nav() {
    el('nav').innerHTML = G.map(function (g) {
      return '<button type="button" data-id="' + g.id + '" class="' + (g === cur ? 'on' : '') + '">' + g.name + '<small>' + g.sub + '</small></button>';
    }).join('');
  }
  function v(g, k, d) { var x = vals[g.id]; return x && x[k] != null ? x[k] : d; }
  function form() {
    var h = cur.f.map(function (f) {
      var val = v(cur, f[0], f[2]), inp;
      if (Array.isArray(f[3])) inp = '<select name="' + f[0] + '">' + f[3].map(function (o) { return '<option' + (o === val ? ' selected' : '') + ' value="' + o + '">' + (o || 'auto') + '</option>'; }).join('') + '</select>';
      else if (f[3] === 'area') inp = '<textarea name="' + f[0] + '"></textarea>';
      else inp = '<input name="' + f[0] + '">';
      return '<label>' + f[1] + inp + '</label>';
    }).join('');
    h += '<label>Auto-out after (seconds, 0 = stays until removed)<input name="_dur" type="number" min="0" step="1"></label>';
    if (cur.id === 'lower-third') h = '<div class="row">' + PRESETS.map(function (p, i) {
      return '<button type="button" class="btn" data-preset="' + i + '">' + p.name + ' · ' + p.role + '</button>'; }).join('') + '</div>' + h;
    if (cur.hint) h += '<p class="hint">' + cur.hint + '</p>';
    el('form').innerHTML = h;
    cur.f.forEach(function (f) { var n = el('form').elements[f[0]]; if (n.tagName !== 'SELECT') n.value = v(cur, f[0], f[2]); });
    el('form').elements._dur.value = v(cur, '_dur', cur.dur);
  }
  function params(extra) {
    var q = new URLSearchParams();
    cur.f.forEach(function (f) {
      var val = String(v(cur, f[0], f[2]) || '');
      if (f[0] === 'f') val = val.split('\n').map(function (s) { return s.trim(); }).filter(Boolean).join(';');
      if (val !== '') q.set(f[0], val);
    });
    Object.keys(extra || {}).forEach(function (k) { q.set(k, extra[k]); });
    return q.toString();
  }
  function render(reload) {
    var dur = +v(cur, '_dur', cur.dur) || 0;
    var url = base + cur.id + '.html?' + params(dur ? { out: dur } : {});
    el('url').textContent = url; el('open').href = url;
    // BS: served from the same origin, so the overlay takes a root-relative path when we are on BS
    var bsUrl = /\/player\//.test(location.pathname) ? location.pathname.replace(/[^/]*$/, '') + cur.id + '.html?' + params() : url;
    // Pages with a full-frame layout (full=1) go to the gfx_full slot; day.html with l3=1 goes to gfx_l3
    var slot = cur.fullSlot && String(v(cur, 'full', '')) === '1' ? cur.fullSlot : cur.slot;
    if (cur.l3Slot && String(v(cur, 'l3', '')) === '1') slot = cur.l3Slot;   // day.html: full-frame by default, l3=1 is a band
    var o = { type: slot, url: bsUrl }; if (dur) o.duration = dur;
    el('bsJson').textContent = JSON.stringify(o);
    el('bsRemove').textContent = 'Clear with remove_overlay  { "overlay_type": "' + slot + '" }';
    // Preview only: portrait (format=portrait, what the NAR portrait programme appends), the socials safe-zone guides,
    // and sample data for the live-data pages (never in the copied URL / payload)
    var pv = Object.assign({}, cur.pv || {}, el('bgStudio').checked ? { bg: 'studio' } : {});
    el('pv').parentNode.classList.toggle('portrait', el('pvPortrait').checked);
    if (el('pvPortrait').checked) { pv.format = 'portrait'; if (el('pvGuides').checked) pv.guides = '1'; }
    if (reload) el('pv').src = base + cur.id + '.html?' + params(pv);
  }
  // Auto-out on BS is the overlay duration (the page gets told to animate out); in OBS use ?out=
  el('nav').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    cur = G.filter(function (g) { return g.id === b.dataset.id; })[0]; nav(); form(); render(true);
  });
  var t;
  el('form').addEventListener('input', function (e) {
    (vals[cur.id] = vals[cur.id] || {})[e.target.name] = e.target.value; save();
    render(false); clearTimeout(t); t = setTimeout(function () { render(true); }, 400);
  });
  el('bIn').onclick = function () { el('pv').contentWindow.postMessage({ sl: 'in' }, '*'); };
  el('bOut').onclick = function () { el('pv').contentWindow.postMessage({ sl: 'out' }, '*'); };
  el('bgStudio').onchange = el('pvPortrait').onchange = el('pvGuides').onchange = function () { render(true); };
  document.addEventListener('click', function (e) {
    var id = e.target.dataset && e.target.dataset.copy; if (!id) return;
    navigator.clipboard.writeText(el(id).textContent).then(function () {
      el('toast').classList.add('show'); setTimeout(function () { el('toast').classList.remove('show'); }, 900);
    });
  });
  nav(); form(); render(true);
</script>
</body></html>
