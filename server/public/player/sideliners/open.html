<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>SideLiner's — Show open</title>
<link rel="stylesheet" href="css/sl.css">
<style>
  /* Full-frame title sequence (~4 s, holds on end frame). For the full produced intro with the
     presenters, use the Remotion render (video/out/sideliners-intro.mp4). */
  .bg { position: absolute; inset: 0; background: var(--navy); overflow: hidden; }
  .bg::before { content: ''; position: absolute; inset: 0; background: var(--hero); opacity: 0; }
  .in .bg::before { animation: fadeIn 1.4s ease 1.2s forwards; }
  .sweep { position: absolute; top: -10%; bottom: -10%; transform: skewX(-15deg) translateX(-2600px); }
  .s1 { left: 0; width: 70%; background: var(--purple); }
  .s2 { left: 20%; width: 45%; background: var(--navy); }
  .s3 { left: 55%; width: 12%; background: var(--amber); }
  .in .s1 { animation: sweep 1.3s cubic-bezier(.7,0,.2,1) .1s forwards; }
  .in .s2 { animation: sweep 1.3s cubic-bezier(.7,0,.2,1) .25s forwards; }
  .in .s3 { animation: sweep 1.3s cubic-bezier(.7,0,.2,1) .4s forwards; }
  @keyframes sweep { to { transform: skewX(-15deg) translateX(2600px); } }
  @keyframes fadeIn { to { opacity: 1; } }
  .lock { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .sllock { height: 470px; clip-path: inset(0 100% 0 0); }
  .in .sllock { animation: reveal .8s cubic-bezier(.7,0,.2,1) 1.25s forwards; }
  @keyframes reveal { to { clip-path: inset(0 0 0 0); } }
  .tag { margin-top: 44px; font: 700 50px/1 var(--body); letter-spacing: .3em; text-transform: uppercase; opacity: 0; transform: translateY(20px); }
  .in .tag { animation: up .7s var(--ease) 2s forwards; }
  .spon { position: absolute; bottom: 80px; left: 0; right: 0; text-align: center; font: 700 32px/1 var(--body); letter-spacing: .2em; text-transform: uppercase; color: #fff; opacity: 0; }
  .in .spon { animation: up .7s var(--ease) 2.4s forwards; }
  @keyframes up { to { opacity: 1; transform: none; } }
  .out .lock, .out .spon { opacity: 0; transition: opacity .3s; }
  /* Portrait: lockup, tagline and sponsor stacked in the safe box (centred on its x 505 axis);
     the presenters rise into the lower frame after the lockup lands. */
  /* Presenter cut-outs (the station website's own transparent PNGs), portrait only */
  .people { position: absolute; left: 0; right: 0; bottom: 0; height: 900px; pointer-events: none; }
  .people img { position: absolute; bottom: 0; height: 900px; width: auto; }
  .people .p1 { left: -150px; }   /* Scott Watson */
  .people .p2 { right: -175px; }  /* Elliot Boyce */
  .people::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 420px;
    background: linear-gradient(0deg, rgba(21, 20, 53, .85), rgba(21, 20, 53, 0)); }
  .portrait .lock { left: var(--sx); right: auto; width: var(--sw); top: 300px; bottom: auto; justify-content: flex-start; }
  .portrait .sllock { height: 520px; }
  .portrait .tag { margin-top: 40px; font-size: 48px; letter-spacing: .26em; text-align: center; }
  .portrait .spon { position: static; margin-top: 26px; font-size: 30px; line-height: 1.2; opacity: 0; transform: translateY(20px); max-width: var(--sw); }
  .portrait .people { opacity: 0; transform: translateY(120px); }
  .in .people { animation: up .9s var(--ease) 2.2s forwards; }
  .out .people { opacity: 0; transition: opacity .3s; }
</style></head>
<body>
<div class="bg"><div class="sweep s1"></div><div class="sweep s2"></div><div class="sweep s3"></div></div>
<div class="lock"><div id="lk"></div><div class="tag" id="tag"></div></div>
<div class="spon" id="spon"></div>
<script src="js/sl.js"></script>
<script>
  document.getElementById('lk').innerHTML = SL.lockup();
  document.getElementById('tag').textContent = SL.p('tag', 'Saturdays 10am–2pm');
  document.getElementById('spon').textContent = SL.p('spon', 'Sponsored by Kilmarnock Football Club');
  // Portrait: the presenters stand in the lower half of the frame (imagery may run to the frame edge)
  function people(host, before, cls, d) {
    if (SL.p('people', '1') === '0') return;
    var p = document.createElement('div'); p.className = 'people' + (cls ? ' ' + cls : ''); if (d) p.style.cssText = d;
    p.innerHTML = '<img class="p1" src="people/scott-watson.png" alt="Scott Watson">' +
      '<img class="p2" src="people/elliot-boyce.png" alt="Elliot Boyce">';
    host.insertBefore(p, before);
  }
  if (SL.portrait) {
    people(document.body, document.querySelector('.lock'));
    document.querySelector('.lock').appendChild(document.getElementById('spon'));
  }
  SL.boot();
</script>
</body></html>
