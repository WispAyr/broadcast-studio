<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>SideLiner's — Holding slate</title>
<link rel="stylesheet" href="css/sl.css">
<style>
  /* Full-frame, opaque. ?m=soon | break | back | end | custom (with ?k= ?t= ?s=) */
  .bg { position: absolute; inset: 0; background: var(--hero); overflow: hidden; }
  /* Slanted bands — the lean of the show artwork's bars */
  .band { position: absolute; top: -10%; bottom: -10%; transform: skewX(-15deg); }
  .b1 { left: 58%; width: 360px; background: rgba(21, 20, 53, .35); animation: drift 26s ease-in-out infinite alternate; }
  .b2 { left: 74%; width: 120px; background: rgba(250, 166, 26, .16); animation: drift 19s ease-in-out infinite alternate-reverse; }
  .b3 { left: 88%; width: 520px; background: rgba(21, 20, 53, .28); animation: drift 31s ease-in-out infinite alternate; }
  @keyframes drift { to { translate: -120px 0; } }
  .wrap { position: absolute; left: 150px; right: 150px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; }
  .kick { --pg: var(--amber); --k: 14px; color: var(--navy); padding: 11px 40px 13px 32px; font: 700 38px/1 var(--body); letter-spacing: .18em; text-transform: uppercase; }
  .sllock { height: 380px; margin: 34px 0 0 -8px; }
  .t { margin-top: 40px; font: italic 700 84px/1.05 var(--display); max-width: 1500px; }
  .s { margin-top: 16px; font: 300 46px/1.2 var(--body); color: var(--ink-2); max-width: 1500px; }
  .foot { position: absolute; left: 150px; right: 150px; bottom: 80px; display: flex; justify-content: space-between; align-items: flex-end;
    font: 700 30px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); }
  .clock { font: 700 64px/1 var(--body); font-variant-numeric: tabular-nums; color: #fff; letter-spacing: 0; }
  /* Portrait: stacked in the safe box (x 60-950, y 270-1440): kicker, lockup, headline, sub-line;
     presenters fill the lower frame; sponsor + clock on a strip at the foot of the safe box. */
  /* Presenter cut-outs (the station website's own transparent PNGs), portrait only */
  .people { position: absolute; left: 0; right: 0; bottom: 0; height: 900px; pointer-events: none; }
  .people img { position: absolute; bottom: 0; height: 900px; width: auto; }
  .people .p1 { left: -150px; }   /* Scott Watson */
  .people .p2 { right: -175px; }  /* Elliot Boyce */
  .people::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 420px;
    background: linear-gradient(0deg, rgba(21, 20, 53, .85), rgba(21, 20, 53, 0)); }
  .portrait .b1 { left: 40%; width: 300px; } .portrait .b2 { left: 70%; } .portrait .b3 { left: 86%; width: 420px; }
  .portrait .wrap { left: var(--sx); right: auto; width: var(--sw); top: 300px; bottom: auto; justify-content: flex-start; }
  .portrait .kick { font-size: 40px; padding: 12px 42px 14px 34px; }
  .portrait .sllock { height: 350px; margin: 34px 0 0 0; }
  .portrait .t { margin-top: 36px; font-size: 84px; line-height: 1.04; max-width: var(--sw); }
  .portrait .s { margin-top: 16px; font-size: 50px; line-height: 1.12; max-width: var(--sw); color: #fff; }
  .portrait .foot { display: none; }
  .portrait .pclock { position: absolute; top: 294px; right: 130px; font: 700 64px/1 var(--body); font-variant-numeric: tabular-nums; }
  .portrait .pspon { margin-top: 30px; font: 700 28px/1.2 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); max-width: var(--sw); }
</style></head>
<body>
<div class="bg a fade" style="--d:0s"><div class="band b1"></div><div class="band b2"></div><div class="band b3"></div></div>
<div class="wrap">
  <div class="kick pg a wipe" style="--d:.3s" id="kick"></div>
  <div class="a wipe" style="--d:.45s" id="lock"></div>
  <div class="t a rise" style="--d:.8s" id="t"></div>
  <div class="s a rise" style="--d:.95s" id="s"></div>
</div>
<div class="foot a fade" style="--d:1.2s">
  <span id="spon"></span>
  <span class="clock" id="clock"></span>
</div>
<script src="js/sl.js"></script>
<script>
  // Show facts from nowayrshireradio.co.uk/shows/now-sport: Saturday 10am–2pm, sponsored by Kilmarnock FC.
  var MODES = {
    soon:   ['Coming up', "SideLiner's starts shortly", 'Saturdays 10am–2pm on Now Ayrshire Radio'],
    break:  ['Stay with us', 'Back after this', 'Your Saturday build-up to the football'],
    back:   ['Welcome back', "This is SideLiner's", 'Saturdays 10am–2pm on Now Ayrshire Radio'],
    end:    ['Thanks for watching', "That's SideLiner's for this week", 'Back next Saturday at 10am'],
    custom: ["SideLiner's", '', '']
  };
  var md = MODES[SL.p('m', 'soon')] || MODES.soon;
  document.getElementById('kick').textContent = SL.p('k', md[0]);
  document.getElementById('lock').innerHTML = SL.lockup();
  var t = SL.p('t', md[1]), s = SL.p('s', md[2]);
  if (t) document.getElementById('t').textContent = t; else document.getElementById('t').remove();
  if (s) document.getElementById('s').textContent = s; else document.getElementById('s').remove();
  document.getElementById('spon').textContent = SL.p('spon', 'Sponsored by Kilmarnock Football Club');
  var c = document.getElementById('clock');
  if (SL.p('clock', '1') === '0') c.remove();
  else { var tk = function () { c.textContent = SL.hhmm(); }; tk(); setInterval(tk, 1000); }
  // Portrait: the presenters stand in the lower half of the frame (imagery may run to the frame edge)
  function people(host, before, cls, d) {
    if (SL.p('people', '1') === '0') return;
    var p = document.createElement('div'); p.className = 'people' + (cls ? ' ' + cls : ''); if (d) p.style.cssText = d;
    p.innerHTML = '<img class="p1" src="people/scott-watson.png" alt="Scott Watson">' +
      '<img class="p2" src="people/elliot-boyce.png" alt="Elliot Boyce">';
    host.insertBefore(p, before);
  }
  if (SL.portrait) {
    people(document.body, document.querySelector('.wrap'), 'a rise', '--d:.55s');
    // Clock top-right opposite the kicker; sponsor line under the sub-line (the foot strip would cut the presenters)
    var sp = document.getElementById('spon'); sp.className = 'pspon a rise'; sp.style.setProperty('--d', '1.1s');
    document.querySelector('.wrap').appendChild(sp);
    if (c.parentNode) { c.className = 'pclock a fade'; c.style.setProperty('--d', '1.2s'); document.body.appendChild(c); }
    document.fonts.ready.then(function () { SL.fitLines(document.getElementById('t'), 2, 56); SL.fitLines(document.getElementById('s'), 2, 34); });
  }
  SL.boot();
</script>
</body></html>
