<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>SideLiner's — Scores</title>
<link rel="stylesheet" href="css/sl.css">
<style>
  /* Live scores / results ticker. Default: a gfx_l3 band that pages through the matches, one competition per page.
     full=1: an opaque full-frame "Latest scores" board (gfx_full), like fixtures.html full=1.
     Data: Broadcast Studio /api/datafeeds/sideliners/public, polled every 15 s. Honesty rules live in the script. */
  .card { position: absolute; left: 50%; bottom: 100px; width: 1560px; margin-left: -780px; }
  .top { display: flex; align-items: flex-end; height: 58px; }
  #dyn, #compbox { display: flex; align-items: flex-end; min-width: 0; }
  .tag { --k: 14px; --pg: #fff; color: var(--navy); padding: 12px 38px 12px 30px; z-index: 1; display: flex; align-items: center; gap: 14px;
    font: 700 34px/1 var(--body); letter-spacing: .16em; text-transform: uppercase; white-space: nowrap; }
  .tag.live { --pg: var(--red); color: #fff; }
  .tag.upd { --pg: var(--aqua); color: var(--navy); }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: currentColor; flex: none; }
  .in .dot { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  .comp { --k: 14px; margin-left: -8px; padding: 10px 40px 12px 34px; font: 700 30px/1 var(--body);
    letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; overflow: hidden; max-width: 900px; }
  .comp small { font-size: 22px; letter-spacing: .1em; opacity: .7; margin-left: 14px; }
  .sample { margin: 0 18px 10px auto; padding: 5px 12px 7px; border: 2px solid var(--aqua); color: var(--aqua);
    font: 700 20px/1 var(--body); letter-spacing: .18em; text-transform: uppercase; white-space: nowrap; }
  .top #brand { margin-left: auto; }
  .sample + #brand { margin-left: 0; }
  #rows { display: flex; flex-direction: column; gap: 6px; padding-top: 0; }
  .row { display: grid; grid-template-columns: 1fr 50px 156px 50px 1fr 124px; align-items: center; column-gap: 18px;
    height: 66px; background: var(--navy-glass); position: relative; padding: 0 16px 0 0; --cs: 50px; }
  .row:first-child { border-top: 5px solid var(--amber); height: 71px; }
  .row.local { background: linear-gradient(90deg, rgba(250, 166, 26, .24), var(--navy-glass) 26%, var(--navy-glass) 74%, rgba(250, 166, 26, .24)); }
  .row.local::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 8px; background: var(--amber); }
  .row .crest { box-shadow: 0 0 0 2px rgba(255,255,255,.14); }
  .row .crest.mono { box-shadow: inset 0 0 0 3px rgba(255,255,255,.9); }
  .row .crest.mono span { font-size: calc(var(--cs) * .27); letter-spacing: -.02em; }
  .t { font: italic 700 var(--fs, 38px)/1.1 var(--display); white-space: nowrap; overflow: hidden; min-width: 0; padding: 2px 0 4px; }
  .t.h { text-align: right; padding-left: 30px; } .t.a { text-align: left; }
  .sc { justify-self: center; align-self: stretch; margin: 7px 0; width: 100%; background: #fff; color: var(--navy);
    display: flex; align-items: center; justify-content: center; gap: 12px;
    font: italic 700 calc(var(--fs, 38px) * 1.08)/1 var(--display); font-variant-numeric: tabular-nums; }
  .sc i { font-style: normal; opacity: .35; }
  .sc.v { font-size: calc(var(--fs, 38px) * .9); color: rgba(21,20,53,.6); }
  .sc.flash { animation: flash 2.4s ease-out; }
  @keyframes flash { 0%, 40% { background: var(--amber); } 100% { background: #fff; } }
  .st { justify-self: end; min-width: 104px; text-align: center; padding: 8px 12px 10px; font: 700 calc(var(--fs, 38px) * .78)/1 var(--body);
    letter-spacing: .04em; font-variant-numeric: tabular-nums; border: 2px solid rgba(255,255,255,.4); color: #fff; white-space: nowrap; }
  .st.live { background: var(--red); border-color: var(--red); }
  .st.ht { background: var(--amber); border-color: var(--amber); color: var(--navy); }
  .st.ns { border-color: transparent; color: var(--ink-2); }
  .msg { display: flex; align-items: center; gap: 18px; height: 72px; padding: 0 34px; background: var(--navy-glass); border-top: 5px solid var(--amber);
    font: 700 32px/1 var(--body); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-2); }
  .msg.upd { border-top-color: var(--aqua); }
  .msg .dot { color: var(--aqua); }
  .prog { height: 4px; background: rgba(255,255,255,.18); margin-top: 0; }
  .prog b { display: block; height: 100%; width: 0; background: var(--amber); }
  .prog.run b { animation: prog var(--pt, 7s) linear forwards; }
  @keyframes prog { to { width: 100%; } }
  /* Page turn: rows wipe off to the right, the next page wipes in from the left */
  .gone .a { clip-path: inset(-20px -40px -20px 100%) !important; transition: clip-path .36s var(--ease-wipe) var(--od, 0s) !important; }
  .pre .a { clip-path: inset(-20px 100% -20px -40px) !important; transition: none !important; }

  /* ---- full=1: opaque full-frame board ---- */
  body.full .bgfill { position: absolute; inset: 0; background: var(--hero); }
  body.full .bgfill::after { content: ''; position: absolute; left: -10%; right: 40%; top: 0; bottom: 0; background: rgba(21,20,53,.55); transform: skewX(-15deg); }
  .board { position: absolute; left: 50%; top: 96px; bottom: 96px; width: 1480px; margin-left: -740px; display: flex; flex-direction: column; }
  .head { display: flex; align-items: flex-end; justify-content: space-between; padding-bottom: 18px; border-bottom: 5px solid var(--amber); }
  .head h1 { margin: 0; font: italic 700 84px/1 var(--display); }
  .head .tag { margin-bottom: 8px; }
  .head .hr { display: flex; align-items: flex-end; gap: 20px; padding-bottom: 6px; }
  .board #rows { flex: 1; min-height: 0; justify-content: center; gap: var(--gap, 10px); padding-top: 16px; }
  .board .row { height: var(--rh, 74px); }
  .board .row:first-child { border-top: 0; height: var(--rh, 74px); }
  .grp { --k: 10px; align-self: flex-start; padding: 7px 20px 9px; margin-top: 10px;
    font: 700 var(--gfs, 24px)/1 var(--body); letter-spacing: .18em; text-transform: uppercase; }
  .foot { display: flex; justify-content: space-between; align-items: center; padding-top: 16px; gap: 24px; }
  .foot img { height: 40px; }
  .legend { font: 700 22px/1 var(--body); letter-spacing: .18em; text-transform: uppercase; color: var(--ink-2); display: flex; align-items: center; gap: 12px; }
  .upd-at { margin-left: auto; font: 700 22px/1 var(--body); letter-spacing: .18em; text-transform: uppercase; color: var(--ink-2); }
  .board .msg { align-self: center; }

  /* ---- Portrait (both modes): each match is two lines — home over away — with the goals in a white column
     and the status chip on the right. l3 sits bottom-left of the safe box; full=1 fills the safe box. ---- */
  .portrait .card { left: var(--sx); margin-left: 0; width: var(--sw); bottom: var(--pb); }
  .portrait .top { height: auto; }
  .portrait .tag { font-size: 38px; padding: 14px 40px 14px 32px; --k: 16px; }
  .portrait .top #brand { margin-bottom: 8px; }
  .portrait .sample { margin-bottom: 18px; }
  .portrait .clabel { padding: 18px 30px 14px; background: var(--navy-glass); border-top: 6px solid var(--amber);
    font: 700 28px/1.1 var(--body); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-2); }
  .portrait .clabel small { font-size: 22px; opacity: .8; margin-left: 10px; }
  .portrait #rows { gap: 0; }
  .portrait .row, .portrait .row:first-child { grid-template-columns: var(--cs) 1fr 84px 128px; grid-template-rows: auto auto; column-gap: 20px; row-gap: 0;
    height: auto; padding: 0 0 0 30px; border-top: 2px solid rgba(255,255,255,.12); --cs: 54px; }
  .portrait .row .crest.hc { grid-row: 1; grid-column: 1; margin-top: 10px; }
  .portrait .row .crest.ac { grid-row: 2; grid-column: 1; margin-bottom: 10px; }
  .portrait .t.h { grid-row: 1; grid-column: 2; text-align: left; padding: 14px 0 4px; }
  .portrait .t.a { grid-row: 2; grid-column: 2; padding: 4px 0 14px; }
  .portrait .t { font-size: var(--fs, 44px); }
  .portrait .sc { display: contents; }
  .portrait .g { grid-column: 3; background: #fff; color: var(--navy); align-self: stretch; display: grid; place-items: center;
    font: italic 700 calc(var(--fs, 44px) * 1.1)/1 var(--display); font-variant-numeric: tabular-nums; }
  .portrait .g.h { grid-row: 1; padding-top: 6px; } .portrait .g.a { grid-row: 2; padding-bottom: 6px; }
  .portrait .sc.flash .g { animation: flash 2.4s ease-out; }
  .portrait .sc i { display: none; }
  .portrait .sc.v .g { font-size: calc(var(--fs, 44px) * .7); color: rgba(21,20,53,.45); }
  .portrait .st { grid-row: 1 / 3; grid-column: 4; justify-self: center; min-width: 100px; font-size: calc(var(--fs, 44px) * .72); }
  .portrait .row.local::before { width: 8px; }
  .portrait .msg { font-size: 30px; height: 84px; padding: 0 30px; border-top-width: 6px; }
  body.full.portrait .board { left: var(--sx); margin-left: 0; width: var(--sw); top: 290px; bottom: 480px; }
  body.full.portrait .bgfill::after { left: -40%; right: 30%; }
  .portrait .head { flex-direction: column-reverse; align-items: flex-start; gap: 14px; padding-bottom: 20px; border-bottom-width: 6px; }
  .portrait .head h1 { font-size: 78px; line-height: 1.02; }
  .portrait .head .hr { padding-bottom: 0; width: 100%; }
  .portrait .head .hr #brand { margin-left: auto; }
  .portrait .board #rows { justify-content: flex-start; gap: var(--gap, 8px); padding-top: 14px; }
  .portrait .board #rows > :first-child { margin-top: auto; }
  .portrait .board #rows > :last-child { margin-bottom: auto; }
  .portrait .board .row { height: auto; }
  .portrait .grp { font-size: var(--gfs, 24px); margin-top: 6px; }
  .portrait .foot { flex-wrap: wrap; row-gap: 12px; }
  .portrait .foot img { height: 44px; }
  .portrait .foot .upd-at { order: 3; flex-basis: 100%; margin-left: 0; }
  .portrait .head .sample { margin: 0 0 12px 0; }
</style></head>
<body>
<div class="bgfill a fade"></div>
<div id="root"></div>
<script src="js/sl.js"></script>
<script>
  /* Params
     feed=    JSON source (default /api/datafeeds/sideliners/public on Broadcast Studio, fed by the NAR intranet)
     set=     live (default) | results | all  (all = live, then today's results)
     tier=    1,2  filter on league.tier     league= <id>[,<id>] filter on league.id
     per=     matches per page (l3: 4; full: 10; portrait full: 5)   page= seconds per page (7)
     title=   override the tag / board title      full=1  opaque full-frame board (gfx_full)
     demo=1   built-in sample data (marked SAMPLE DATA on screen) — also demo=stale | demo=empty to preview those states
   HONESTY: live scores only while the feed is fresh (stale=false and ageSec <= 120, aged locally between polls).
   Otherwise the live rows are withdrawn and SCORES UPDATING shows instead; a cached score is never shown as live.
   Settled results (FT/AET/PEN) may still show while the feed is catching up. Nothing matching → a short
   "No matches in play" and then the graphic animates out. */
  var FULL = SL.p('full') === '1', PORT = SL.portrait;
  if (FULL) document.body.classList.add('full');
  var SET = SL.p('set', 'live'); if (['live', 'results', 'all'].indexOf(SET) === -1) SET = 'live';
  var PER = Math.max(1, +SL.p('per', FULL ? (PORT ? 5 : 10) : 4) || 4), PAGE = Math.max(3, +SL.p('page', 7) || 7);
  var TIERS = SL.list('tier').map(Number), LEAGUES = SL.list('league').map(String);
  var DEMO = SL.p('demo'), FEED = SL.p('feed', '/api/datafeeds/sideliners/public');
  var MAX_AGE = 120, POLL = 15000;
  var DATA = null, gotAt = 0, pages = [], pi = 0, cycleT = 0, pollT = 0, emptyT = 0, shown = '', last = {};

  function el(id) { return document.getElementById(id); }
  function nowS() { return Date.now() / 1000; }
  function toSec(g) { if (g == null || g === '') return null; if (typeof g === 'number') return g > 1e12 ? g / 1000 : g; var t = Date.parse(g); return isNaN(t) ? null : t / 1000; }
  function age() {
    if (!DATA) return Infinity;
    var base = typeof DATA.ageSec === 'number' ? DATA.ageSec : (toSec(DATA.generated) != null ? gotAt / 1000 - toSec(DATA.generated) : Infinity);
    return base + (Date.now() - gotAt) / 1000;
  }
  function isStale() { return !DATA || DATA.ok === false || DATA.stale === true || !(age() <= MAX_AGE); }
  function hhmm(ts) {
    try { return new Date(ts * 1000).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/London' }); }
    catch (e) { var d = new Date(ts * 1000); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  }
  function isLocal(f) {
    var h = f.home || {}, a = f.away || {};
    return f.local === 'AYRSHIRE' || h.local === 'AYRSHIRE' || a.local === 'AYRSHIRE' || SL.isAyr(h.name) || SL.isAyr(a.name);
  }
  // Status chip. In-play → the minute; nothing unfinished is ever labelled as finished.
  function status(f) {
    var s = String(f.status || '').toUpperCase(), e = f.elapsed, x = f.extra;
    var min = e != null && e !== '' ? e + (x ? '+' + x : '') + "'" : '';
    switch (s) {
      case '1H': case '2H': case 'ET': case 'LIVE': return { t: min || 'LIVE', c: 'live' };
      case 'HT': return { t: 'HT', c: 'ht' };
      case 'BT': return { t: 'ET BRK', c: 'ht' };
      case 'P': return { t: 'PENS', c: 'live' };
      case 'FT': return { t: 'FT', c: 'ft' };
      case 'AET': return { t: 'AET', c: 'ft' };
      case 'PEN': return { t: 'PENS', c: 'ft' };
      case 'NS': return { t: f.ts ? hhmm(f.ts) : 'KO TBC', c: 'ns' };
      case 'TBD': return { t: 'KO TBC', c: 'ns' };
      case 'PST': return { t: 'P-P', c: 'ns' };
      case 'CANC': return { t: 'OFF', c: 'ns' };
      case 'ABD': return { t: 'ABND', c: 'ns' };
      case 'SUSP': case 'INT': return { t: s, c: 'ht' };
      default: return { t: s || '–', c: 'ns' };
    }
  }
  function goals(f) {
    var h = f.home && f.home.goals, a = f.away && f.away.goals;
    return h == null || a == null ? null : [h, a];
  }
  function keep(f) {
    var L = f.league || {};
    if (TIERS.length && TIERS.indexOf(+L.tier) === -1) return false;
    if (LEAGUES.length && LEAGUES.indexOf(String(L.id)) === -1) return false;
    return true;
  }
  var LIVE_ST = ['1H', 'HT', '2H', 'ET', 'BT', 'P', 'LIVE', 'SUSP', 'INT'];
  function isLiveFx(f) { return f.finished !== true && (f.live === true || LIVE_ST.indexOf(String(f.status || '').toUpperCase()) !== -1); }

  // What may be shown right now, given the data's freshness
  function state() {
    if (!DATA) return { mode: 'updating' };
    var st = isStale();
    var res = (DATA.results || []).filter(keep).filter(function (f) { return !isLiveFx(f); }).map(function (f) { return { f: f, k: 'res' }; });
    if (SET === 'results') return res.length ? { mode: 'ok', list: res } : { mode: st ? 'updating' : 'empty' };
    if (st) return { mode: 'updating' };
    var live = (DATA.live || []).filter(keep).filter(function (f) { return f.finished !== true; }).map(function (f) { return { f: f, k: 'live' }; });
    var list = SET === 'all' ? live.concat(res) : live;
    return list.length ? { mode: 'ok', list: list } : { mode: 'empty' };
  }
  function paginate(list) {
    // group by kind + competition, lower tier first, then first-seen order
    var groups = [], by = {};
    list.forEach(function (it, i) {
      var L = it.f.league || {}, key = it.k + '|' + (L.id != null ? L.id : L.name);
      if (!by[key]) { by[key] = { k: it.k, name: L.name || '', tier: L.tier == null ? 99 : +L.tier, i: i, items: [] }; groups.push(by[key]); }
      by[key].items.push(it.f);
    });
    groups.sort(function (a, b) { return (a.k === b.k ? 0 : a.k === 'live' ? -1 : 1) || a.tier - b.tier || a.i - b.i; });
    var out = [];
    if (!FULL) {
      groups.forEach(function (g) {
        var n = Math.ceil(g.items.length / PER);
        for (var p = 0; p < n; p++) out.push({ k: g.k, groups: [{ name: g.name, part: n > 1 ? (p + 1) + '/' + n : '', items: g.items.slice(p * PER, (p + 1) * PER) }] });
      });
    } else {
      var cur = null, count = 0;
      groups.forEach(function (g) {
        for (var i = 0; i < g.items.length; i++) {
          if (!cur || count >= PER || cur.k !== g.k) { cur = { k: g.k, groups: [] }; out.push(cur); count = 0; }
          var last = cur.groups[cur.groups.length - 1];
          if (!last || last.src !== g) { last = { name: g.name, part: '', src: g, items: [] }; cur.groups.push(last); }
          last.items.push(g.items[i]); count++;
        }
      });
    }
    return out;
  }

  function tagHtml(k, cls) {
    var t = SL.p('title');
    if (k === 'upd') return '<div class="tag pg upd a wipe-up' + (cls || '') + '" style="--od:.1s"><span class="dot"></span>' + SL.esc(t || 'Scores') + '</div>';
    if (k === 'live') return '<div class="tag pg live a wipe-up" style="--d:.1s;--od:.1s"><span class="dot"></span>' + SL.esc(t || 'Live scores') + '</div>';
    if (k === 'empty') return '<div class="tag pg a wipe-up" style="--d:.1s;--od:.1s">' + SL.esc(t || (SET === 'results' ? 'Results' : 'Live scores')) + '</div>';
    return '<div class="tag pg a wipe-up" style="--d:.1s;--od:.1s">' + SL.esc(t || 'Results') + '</div>';
  }
  function rowHtml(f, i) {
    var h = f.home || {}, a = f.away || {}, g = goals(f), s = status(f);
    var d = ' style="--d:' + (.12 + i * .07).toFixed(2) + 's;--od:' + (i * .04).toFixed(2) + 's"';
    var sc = PORT
      ? '<span class="sc' + (g ? '' : ' v') + '" data-sc><span class="g h">' + (g ? g[0] : 'v') + '</span><span class="g a">' + (g ? g[1] : '') + '</span></span>'
      : '<span class="sc' + (g ? '' : ' v') + '" data-sc>' + (g ? g[0] + '<i>–</i>' + g[1] : 'v') + '</span>';
    var hc = SL.crest(h.logo, h.name).replace('class="crest', 'class="crest hc'), ac = SL.crest(a.logo, a.name).replace('class="crest', 'class="crest ac');
    return '<div class="row a wipe' + (isLocal(f) ? ' local' : '') + '" data-id="' + SL.esc(f.id) + '"' + d + '>' +
      '<span class="t h">' + SL.esc(h.name) + '</span>' + hc + sc + ac + '<span class="t a">' + SL.esc(a.name) + '</span>' +
      '<span class="st ' + s.c + '" data-st>' + SL.esc(s.t) + '</span></div>';
  }
  function msgHtml(kind, text) {
    return '<div class="msg a wipe' + (kind === 'upd' ? ' upd' : '') + '" style="--d:.15s">' + (kind === 'upd' ? '<span class="dot"></span>' : '') + SL.esc(text) + '</div>';
  }
  function sample() { return DEMO ? '<span class="sample a fade" style="--d:.5s">Sample data</span>' : ''; }
  function updatedAt() { var g = toSec(DATA && DATA.generated); return g ? 'Updated ' + hhmm(g) : ''; }

  // ---- layout shells ----
  if (!FULL) {
    el('root').innerHTML = '<div class="card"><div class="top"><div id="dyn"></div><div id="compbox"></div>' + sample() +
      '<span class="a rise" id="brand" style="--d:.5s">' + SL.wordmark(PORT ? 64 : 52) + '</span></div>' +
      (PORT ? '<div id="clabel"></div>' : '') + '<div id="rows"></div><div class="prog a fade" id="prog" style="--d:.6s"><b></b></div></div>';
  } else {
    el('root').innerHTML = '<div class="board"><div class="head a wipe" style="--d:.05s"><div><div id="dyn"></div><h1 id="h1"></h1></div>' +
      '<div class="hr">' + sample() + '<span id="brand">' + SL.wordmark(64) + '</span></div></div>' +
      '<div id="rows"></div><div class="foot a fade" style="--d:.9s"><span class="legend" id="legend"><span class="ayr">Ayrshire</span> Ayrshire clubs highlighted</span>' +
      '<span class="upd-at" id="updAt"></span><img src="logo/nar-long-white.svg" alt="Now Ayrshire Radio"></div></div>';
  }

  // Render one view into the dynamic parts. anim: page-turn wipe (only while on air).
  function paint(view, anim) {
    var dyn, rows = '', clabel = '', comp = '', h1 = '';
    if (view.mode === 'ok') {
      var pg = view.page, i = 0;
      dyn = tagHtml(pg.k);
      pg.groups.forEach(function (g) {
        if (FULL) rows += '<div class="grp pg a wipe" style="--d:' + (.14 + i * .07).toFixed(2) + 's">' + SL.esc(g.name) + '</div>';
        g.items.forEach(function (f) { rows += rowHtml(f, i++); });
      });
      var g0 = pg.groups[0], part = g0.part ? '<small>' + g0.part + '</small>' : '';
      if (!FULL && !PORT) comp = '<div class="comp pg a wipe" style="--d:.1s;--od:.05s">' + SL.esc(g0.name) + part + '</div>';
      if (!FULL && PORT) clabel = '<div class="clabel a wipe" style="--d:.1s;--od:.05s">' + SL.esc(g0.name) + part + '</div>';
      h1 = SL.p('title') || (pg.k === 'live' ? 'Live scores' : SET === 'all' ? 'Latest scores' : 'Results');
    } else if (view.mode === 'updating') {
      dyn = tagHtml('upd'); rows = msgHtml('upd', 'Scores updating'); h1 = SL.p('title') || 'Latest scores';
    } else {
      dyn = tagHtml('empty'); rows = msgHtml('', SET === 'results' ? 'No results yet' : 'No matches in play'); h1 = SL.p('title') || 'Latest scores';
    }
    if (FULL) dyn = '';                    // the board's own title says it
    var key = dyn + comp + clabel + rows;
    if (key === shown) return;
    // Only the parts that change turn over; a steady tag stays put
    var parts = [['dyn', dyn], ['compbox', comp], ['clabel', clabel], ['rows', rows]].filter(function (x) { return el(x[0]); });
    var targets = parts.filter(function (x) { return anim === 'pre' || last[x[0]] !== x[1]; }).map(function (x) { return el(x[0]); });
    var apply = function () {
      parts.forEach(function (x) { if (last[x[0]] !== x[1]) { el(x[0]).innerHTML = x[1]; last[x[0]] = x[1]; } });
      if (FULL) {
        el('h1').textContent = h1; el('updAt').textContent = updatedAt();
        el('legend').style.visibility = el('rows').querySelector('.row.local') ? '' : 'hidden';
      }
      fit();
      shown = key;
    };
    if (anim === 'pre') {                  // re-entry on a new play-in: just wipe the fresh content in
      apply();
      targets.forEach(function (t) { t.classList.add('pre'); }); void document.body.offsetWidth;
      targets.forEach(function (t) { t.classList.remove('pre'); });
    } else if (anim && shown && document.body.classList.contains('in')) {
      targets.forEach(function (t) { t.classList.add('gone'); });
      setTimeout(function () {
        apply();
        targets.forEach(function (t) { t.classList.remove('gone'); t.classList.add('pre'); });
        void document.body.offsetWidth;
        targets.forEach(function (t) { t.classList.remove('pre'); });
      }, 400);
    } else apply();
  }

  function fit() {
    var rows = el('rows'), s = document.body.style;
    if (FULL && !PORT) {
      var n = rows.querySelectorAll('.row').length + rows.querySelectorAll('.grp').length;
      var rh = Math.max(50, Math.min(84, Math.floor(700 / Math.max(n, 6)) - 10));
      s.setProperty('--rh', rh + 'px'); s.setProperty('--fs', Math.round(rh * .5) + 'px');
      s.setProperty('--gfs', Math.max(18, Math.round(rh * .32)) + 'px'); s.setProperty('--gap', (rh > 60 ? 10 : 6) + 'px');
    } else if (FULL && PORT) {
      for (var fs = 50; fs >= 28; fs -= 2) {
        s.setProperty('--fs', fs + 'px'); s.setProperty('--gfs', Math.max(20, Math.round(fs * .55)) + 'px'); s.setProperty('--gap', Math.round(fs * .16) + 'px');
        if (rows.scrollHeight <= rows.clientHeight + 1) break;
      }
    }
    rows.querySelectorAll('.t').forEach(function (t) { SL.shrink(t, PORT ? 28 : 24); });
    SL.shrink(document.querySelector('.comp'), 22);
  }

  // Build pages from the current data; returns the view for page `i`
  function view(i) {
    var st = state();
    if (st.mode !== 'ok') { pages = []; return st; }
    pages = paginate(st.list);
    return { mode: 'ok', page: pages[i % pages.length] };
  }
  function show(anim) {
    var v = view(pi);
    if (v.mode === 'ok') pi = pi % pages.length;
    paint(v, anim);
    // Nothing to show: say so briefly, then animate out
    clearTimeout(emptyT);
    // As an overlay, an empty board steps aside. As a full-screen board (full=1, e.g. pushed from the
    // intranet Screens tab) it stays up saying so, and keeps polling, filling in when a match kicks off.
    if (v.mode === 'empty' && SL.on && SL.p('static') !== '1' && SL.p('full') !== '1') emptyT = setTimeout(function () { stopAll(); SL.stop(); }, 5000);
    progress(v.mode === 'ok' && pages.length > 1);
  }
  function progress(on) {
    var p = el('prog'); if (!p) return;
    p.style.visibility = on && SL.p('static') !== '1' ? '' : 'hidden';
    p.classList.remove('run'); void p.offsetWidth;
    if (on && SL.on && SL.p('static') !== '1') { p.style.setProperty('--pt', PAGE + 's'); p.classList.add('run'); }
  }
  // Scores that change on the visible page update in place (with an amber flash) between page turns
  function patch() {
    if (!pages.length) return;
    var all = {}; ((DATA && DATA.live) || []).concat((DATA && DATA.results) || []).forEach(function (f) { all[f.id] = f; });
    document.querySelectorAll('.row[data-id]').forEach(function (r) {
      var f = all[r.dataset.id]; if (!f) return;
      var tmp = document.createElement('div'); tmp.innerHTML = rowHtml(f, 0);
      var n = tmp.firstChild, sc = r.querySelector('[data-sc]'), nsc = n.querySelector('[data-sc]');
      if (sc && nsc && sc.innerHTML !== nsc.innerHTML) { sc.innerHTML = nsc.innerHTML; sc.className = nsc.className + ' flash'; }
      var st = r.querySelector('[data-st]'), nst = n.querySelector('[data-st]');
      if (st && nst && st.outerHTML !== nst.outerHTML) { st.textContent = nst.textContent; st.className = nst.className; }
    });
  }
  function turn() { pi++; show(true); }
  function startCycle() { clearInterval(cycleT); pi = 0; show('pre'); cycleT = setInterval(turn, PAGE * 1000); }
  function stopAll() { clearInterval(cycleT); }

  // ---- data ----
  function demoData() {
    var t = Math.floor(nowS()), ko = t - 67 * 60;
    function fx(id, lg, h, a, hg, ag, st, el, local) {
      var fin = ['FT', 'AET', 'PEN'].indexOf(st) !== -1;
      return { id: id, ts: ko, league: lg, status: st, elapsed: el, extra: null, live: !fin && st !== 'NS', finished: fin,
        home: { name: h, logo: '', goals: hg, local: SL.isAyr(h) ? 'AYRSHIRE' : 'SCOTTISH' },
        away: { name: a, logo: '', goals: ag, local: SL.isAyr(a) ? 'AYRSHIRE' : 'SCOTTISH' }, scorers: [], local: local || null };
    }
    var P = { id: 179, name: 'Scottish Premiership', tier: 1 }, C = { id: 180, name: 'Scottish Championship', tier: 2 },
        L1 = { id: 183, name: 'Scottish League One', tier: 3 };
    var d = { ok: true, generated: new Date().toISOString(), stale: DEMO === 'stale', ageSec: DEMO === 'stale' ? 600 : 6,
      live: [
        fx(1, P, 'Kilmarnock', 'Celtic', 2, 1, '2H', 67, 'AYRSHIRE'), fx(2, P, 'Hearts', 'Aberdeen', 0, 0, 'HT', 45),
        fx(3, P, 'Rangers', 'Motherwell', 3, 1, '2H', 71), fx(4, P, 'Dundee United', 'Hibernian', 1, 1, '2H', 58),
        fx(5, C, 'Ayr United', 'Partick Thistle', 1, 0, '2H', 64, 'AYRSHIRE'), fx(6, C, 'Raith Rovers', 'Greenock Morton', 0, 2, '2H', 66),
        fx(7, L1, 'Inverness Caledonian Thistle', 'Kelty Hearts', 2, 2, '2H', 70) ],
      results: [ fx(8, P, 'St Mirren', 'Dundee', 1, 0, 'FT', 90), fx(9, C, 'Queen\'s Park', 'Airdrieonians', 2, 3, 'FT', 90) ],
      upcoming: [] };
    if (DEMO === 'empty') { d.live = []; d.results = []; }
    return d;
  }
  function take(d) { DATA = d; gotAt = Date.now(); }
  function poll(first) {
    clearTimeout(pollT);
    if (DEMO) { take(demoData()); if (!first) { patch(); if (!pages.length || state().mode !== 'ok') show(true); } return Promise.resolve(); }
    var p = fetch(FEED, { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(take).catch(function () { /* keep the last copy; age() keeps growing, so it goes stale on its own */ })
      .then(function () {
        pollT = setTimeout(function () { poll(false); }, POLL);
        if (first) return;
        var m = state().mode;
        if (m !== 'ok' || !pages.length) show(true);   // state changed (went stale, came back, emptied)
        else { view(pi); patch(); }                     // same state: refresh pages, update visible scores in place
      });
    return p;
  }
  // Freshness is re-checked every few seconds even if a poll hangs: a stale feed never lingers as "live"
  setInterval(function () { if (SL.on && state().mode === 'updating' && shown.indexOf('upd') === -1) show(true); }, 3000);

  document.addEventListener('sl:in', function () { if (SL.p('static') === '1') { shown = ''; show(false); return; } startCycle(); });
  document.addEventListener('sl:out', function () { stopAll(); clearTimeout(emptyT); });

  // First data before the graphic plays in (at most ~4 s wait, then it plays with whatever state it has)
  var booted = false;
  function boot() { if (booted) return; booted = true; show(false); SL.boot(); }
  if (document.fonts) document.fonts.ready.then(function () { if (el('rows').innerHTML) fit(); });
  setTimeout(boot, 4000);
  poll(true).then(boot);
  if (DEMO) setInterval(function () { poll(false); }, POLL);
</script>
