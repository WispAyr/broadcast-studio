<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAR — Pulse</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    cursor: none;
  }
  * { cursor: none; }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Faint ambient ember wash behind everything — pulses with the mark */
  .halo {
    position: fixed;
    inset: -20%;
    background: radial-gradient(ellipse 55% 45% at 50% 50%,
      rgba(241, 90, 34, 0.14) 0%,
      rgba(237, 27, 47, 0.05) 45%,
      rgba(0, 0, 0, 0) 72%);
    animation: halo-breathe 6s cubic-bezier(0.37, 0, 0.63, 1) infinite;
    will-change: opacity;
    pointer-events: none;
  }

  /* The breathing stack: glow clones + crisp lockup */
  .stage {
    position: relative;
    width: min(90vw, 164vh);
    aspect-ratio: 312 / 171;
    animation: breathe 6s cubic-bezier(0.37, 0, 0.63, 1) infinite;
    will-change: transform;
  }
  .stage svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Wide, warm ember glow — softest, largest, deepest layer */
  .glow-wide {
    color: #F15A22;
    filter: blur(2.6vmin);
    animation: glow-wide 6s cubic-bezier(0.37, 0, 0.63, 1) infinite;
    will-change: opacity, transform;
  }

  /* Tighter red-orange glow — hugs the letterforms */
  .glow-tight {
    color: #ED1B2F;
    filter: blur(1.1vmin);
    animation: glow-tight 6s cubic-bezier(0.37, 0, 0.63, 1) infinite;
    will-change: opacity, transform;
  }

  /* Crisp white lockup on top */
  .mark {
    color: #fff;
  }

  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.03); }
  }
  @keyframes glow-wide {
    0%, 100% { opacity: 0.30; transform: scale(1); }
    50%      { opacity: 0.62; transform: scale(1.018); }
  }
  @keyframes glow-tight {
    0%, 100% { opacity: 0.26; transform: scale(1); }
    50%      { opacity: 0.55; transform: scale(1.008); }
  }
  @keyframes halo-breathe {
    0%, 100% { opacity: 0.45; }
    50%      { opacity: 1; }
  }
</style>
</head>
