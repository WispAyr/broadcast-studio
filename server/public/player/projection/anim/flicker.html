<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NAR — Flicker Projection</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    cursor: none;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Stage: 90vw wide, aspect locked to the lockup (241.79 x 64.17),
     capped so it never exceeds 90vh tall on ultra-wide/short viewports. */
  .stage {
    position: relative;
    width: min(90vw, 339vh);
    aspect-ratio: 241.79 / 64.17;
    animation: breathe 12s ease-in-out infinite;
  }

  /* Jitter wrapper — vertical snap displacement during bursts only. */
  .jitter {
    position: absolute;
    inset: 0;
    animation: jit 12s step-end infinite;
    will-change: transform;
  }

  .layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Steady white mark with a faint projector bloom (static filter). */
  .base {
    color: #fff;
    filter: drop-shadow(0 0 0.7vw rgba(255, 255, 255, 0.25));
    animation: flick 12s step-end infinite;
    will-change: opacity;
  }

  /* RGB-split ghost clones: invisible except momentary flashes in bursts. */
  .ghost {
    mix-blend-mode: screen;
    opacity: 0;
    will-change: opacity, transform;
  }
  .ghost.red   { color: #ED1B2F; animation: gr 12s step-end infinite; }
  .ghost.amber { color: #FAA61A; animation: ga 12s step-end infinite; }

  /* Scanline texture: full-viewport, faint at rest, lifted during bursts.
     The stripe layer rolls by an exact multiple of its 3px period so the
     12s loop is seamless. */
  .scan {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.05;
    animation: scanop 12s linear infinite;
    overflow: hidden;
    will-change: opacity;
  }
  .scan::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: calc(100% + 60px);
    background: repeating-linear-gradient(
      to bottom,
      rgba(255, 255, 255, 0.6) 0px,
      rgba(255, 255, 255, 0.6) 1px,
      transparent 1px,
      transparent 3px
    );
    animation: roll 12s linear infinite;
    will-change: transform;
  }

  /* ---- 12s master timeline ----------------------------------------
     Bursts:  A 15.0%–17.0%  (1.80s–2.04s, 240ms)
              B 49.0%–50.6%  (5.88s–6.07s, 190ms)
              C 78.0%–80.5%  (9.36s–9.66s, 300ms)
     Gaps between bursts: ~3.8s / ~3.3s / ~4.1s (wraps seamlessly).   */

  /* Slow projector breathing — barely perceptible. */
  @keyframes breathe {
    0%   { opacity: 1; }
    27%  { opacity: 0.962; }
    52%  { opacity: 0.99; }
    76%  { opacity: 0.955; }
    100% { opacity: 1; }
  }

  /* Vertical snap jitter (percent of logo height ≈ a few px). */
  @keyframes jit {
    0%     { transform: translateY(0); }
    15%    { transform: translateY(1.4%); }
    15.4%  { transform: translateY(-1%); }
    15.8%  { transform: translateY(0.6%); }
    16.3%  { transform: translateY(-0.3%); }
    17%    { transform: translateY(0); }
    49%    { transform: translateY(-1.2%); }
    49.4%  { transform: translateY(0.9%); }
    49.9%  { transform: translateY(-0.4%); }
    50.6%  { transform: translateY(0); }
    78%    { transform: translateY(1.1%); }
    78.4%  { transform: translateY(-1.4%); }
    78.9%  { transform: translateY(0.7%); }
    79.5%  { transform: translateY(-0.4%); }
    80%    { transform: translateY(0.2%); }
    80.5%, 100% { transform: translateY(0); }
  }

  /* Base luminance flicker. */
  @keyframes flick {
    0%     { opacity: 1; }
    15%    { opacity: 0.55; }
    15.2%  { opacity: 0.9; }
    15.5%  { opacity: 0.4; }
    15.8%  { opacity: 1; }
    16.2%  { opacity: 0.75; }
    17%    { opacity: 1; }
    49%    { opacity: 0.5; }
    49.3%  { opacity: 0.95; }
    49.6%  { opacity: 0.65; }
    50.6%  { opacity: 1; }
    78%    { opacity: 0.7; }
    78.3%  { opacity: 0.35; }
    78.7%  { opacity: 0.95; }
    79.2%  { opacity: 0.55; }
    79.8%  { opacity: 0.85; }
    80.5%, 100% { opacity: 1; }
  }

  /* Radio Red channel ghost. */
  @keyframes gr {
    0%     { opacity: 0;    transform: translate(0, 0); }
    15%    { opacity: 0.9;  transform: translate(-0.5%, 1.5%); }
    15.4%  { opacity: 0;    transform: translate(0, 0); }
    15.8%  { opacity: 0.7;  transform: translate(-0.35%, -1%); }
    16.4%  { opacity: 0;    transform: translate(0, 0); }
    49%    { opacity: 0.8;  transform: translate(-0.6%, -1.2%); }
    49.5%  { opacity: 0;    transform: translate(0, 0); }
    78%    { opacity: 0.85; transform: translate(-0.4%, 1%); }
    78.6%  { opacity: 0;    transform: translate(0, 0); }
    79.1%  { opacity: 0.6;  transform: translate(-0.7%, 1.8%); }
    79.7%, 100% { opacity: 0; transform: translate(0, 0); }
  }

  /* Amber Gold channel ghost — mirrored, offset sub-timing. */
  @keyframes ga {
    0%     { opacity: 0;    transform: translate(0, 0); }
    15.1%  { opacity: 0.8;  transform: translate(0.5%, -1.2%); }
    15.5%  { opacity: 0;    transform: translate(0, 0); }
    16%    { opacity: 0.65; transform: translate(0.4%, 1.1%); }
    16.5%  { opacity: 0;    transform: translate(0, 0); }
    49.1%  { opacity: 0.75; transform: translate(0.55%, 1.3%); }
    49.7%  { opacity: 0;    transform: translate(0, 0); }
    78.1%  { opacity: 0.8;  transform: translate(0.45%, -1.1%); }
    78.7%  { opacity: 0;    transform: translate(0, 0); }
    79.3%  { opacity: 0.55; transform: translate(0.65%, -1.6%); }
    79.9%, 100% { opacity: 0; transform: translate(0, 0); }
  }

  /* Scanline visibility envelope. */
  @keyframes scanop {
    0%, 14.8%   { opacity: 0.05; }
    15%, 17%    { opacity: 0.22; }
    17.6%       { opacity: 0.05; }
    48.8%       { opacity: 0.05; }
    49%, 50.6%  { opacity: 0.2; }
    51.2%       { opacity: 0.05; }
    77.8%       { opacity: 0.05; }
    78%, 80.5%  { opacity: 0.26; }
    81.1%, 100% { opacity: 0.05; }
  }

  /* Continuous scanline roll — 60px = 20 x 3px period, seamless. */
  @keyframes roll {
    0%   { transform: translateY(0); }
    100% { transform: translateY(-60px); }
  }
</style>
</head>
