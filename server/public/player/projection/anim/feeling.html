<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NAR — Feeling projection loop</title>
<!--
  NAR "Get turned on to that local Feeling across Ayrshire" — write-on projection loop.
  Source vector: svg/nar-feeling-white.svg (pdftocairo). Unused gradient defs removed.
  10s seamless cycle: dot pop -> script write-on -> supporting words -> heart bounce -> hold -> fade.
  Animates transform / opacity / clip-path only (compositor-friendly, target Chromium).
-->
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    cursor: none;
  }
  .stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  svg.mark {
    display: block;
    /* ~90vw wide, capped so full mark (cropped viewBox aspect 358.7:146) always fits vertically */
    width: min(90vw, 225vh);
    height: auto;
    opacity: 0;
    animation: cycle 10s linear infinite;
    will-change: opacity;
  }

  /* ============ master fade (makes the loop seamless: all child snaps happen at opacity 0) */
  @keyframes cycle {
    0%          { opacity: 0; }
    1.2%        { opacity: 1; }
    88%         { opacity: 1; animation-timing-function: cubic-bezier(.4, 0, .6, 1); }
    97%, 100%   { opacity: 0; }
  }

  /* ============ the dot: disc with "Get turned on to" knockout — pops with slight overshoot */
  .dot {
    transform-box: fill-box;
    transform-origin: 50% 50%;
    animation: dotPop 10s linear infinite;
    will-change: transform, opacity;
  }
  @keyframes dotPop {
    0%, 3%     { opacity: 0; transform: scale(.25); animation-timing-function: cubic-bezier(.2, .7, .3, 1); }
    4.4%       { opacity: 1; }
    7.4%       { transform: scale(1.05); animation-timing-function: cubic-bezier(.35, 0, .3, 1); }
    9.8%, 100% { opacity: 1; transform: scale(1); }
  }

  /* ============ script "Feeling" — per-letter left-to-right handwriting wipe */
  .ltr {
    will-change: clip-path, opacity;
  }
  .ltr-f  { animation: wipeF  10s linear infinite; }
  .ltr-e1 { animation: wipeE1 10s linear infinite; }
  .ltr-e2 { animation: wipeE2 10s linear infinite; }
  .ltr-li { animation: wipeLI 10s linear infinite; }
  .ltr-n  { animation: wipeN  10s linear infinite; }
  .ltr-g  { animation: wipeG  10s linear infinite; }

  @keyframes wipeF {
    0%, 11%     { clip-path: inset(0 100% 0 0); opacity: 0; animation-timing-function: cubic-bezier(.55, .06, .35, .95); }
    12%         { opacity: 1; }
    16.5%, 100% { clip-path: inset(0 0 0 0); opacity: 1; }
  }
  @keyframes wipeE1 {
    0%, 14.5%   { clip-path: inset(0 100% 0 0); opacity: 0; animation-timing-function: cubic-bezier(.55, .06, .35, .95); }
    15.5%       { opacity: 1; }
    20%, 100%   { clip-path: inset(0 0 0 0); opacity: 1; }
  }
  @keyframes wipeE2 {
    0%, 18%     { clip-path: inset(0 100% 0 0); opacity: 0; animation-timing-function: cubic-bezier(.55, .06, .35, .95); }
    19%         { opacity: 1; }
    23.5%, 100% { clip-path: inset(0 0 0 0); opacity: 1; }
  }
  @keyframes wipeLI {
    0%, 21.5%   { clip-path: inset(0 100% 0 0); opacity: 0; animation-timing-function: cubic-bezier(.55, .06, .35, .95); }
    22.5%       { opacity: 1; }
    27%, 100%   { clip-path: inset(0 0 0 0); opacity: 1; }
  }
  @keyframes wipeN {
    0%, 25%     { clip-path: inset(0 100% 0 0); opacity: 0; animation-timing-function: cubic-bezier(.55, .06, .35, .95); }
    26%         { opacity: 1; }
    30.5%, 100% { clip-path: inset(0 0 0 0); opacity: 1; }
  }
  @keyframes wipeG {
    /* the g carries the long flourish tail — give it a little longer */
    0%, 28.5%   { clip-path: inset(0 100% 0 0); opacity: 0; animation-timing-function: cubic-bezier(.5, .05, .3, .98); }
    29.5%       { opacity: 1; }
    36%, 100%   { clip-path: inset(0 0 0 0); opacity: 1; }
  }

  /* ============ supporting words — quiet fade + small rise */
  .that, .across {
    transform-box: fill-box;
    will-change: transform, opacity;
  }
  .that   { animation: thatIn   10s linear infinite; }
  .across { animation: acrossIn 10s linear infinite; }
  @keyframes thatIn {
    0%, 38%   { opacity: 0; transform: translateY(9px); animation-timing-function: cubic-bezier(.22, .6, .3, 1); }
    45%, 100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes acrossIn {
    0%, 42%   { opacity: 0; transform: translateY(9px); animation-timing-function: cubic-bezier(.22, .6, .3, 1); }
    49%, 100% { opacity: 1; transform: translateY(0); }
  }

  /* ============ heart tittle — pops last with a small bounce */
  .heart {
    transform-box: fill-box;
    transform-origin: 50% 60%;
    animation: heartPop 10s linear infinite;
    will-change: transform, opacity;
  }
  @keyframes heartPop {
    0%, 51.5% { opacity: 0; transform: scale(0); animation-timing-function: cubic-bezier(.2, .75, .35, 1); }
    52.5%     { opacity: 1; }
    54.8%     { transform: scale(1.22); animation-timing-function: cubic-bezier(.4, 0, .55, 1); }
    56.6%     { transform: scale(.93);  animation-timing-function: cubic-bezier(.4, 0, .55, 1); }
    58.4%     { transform: scale(1.04); animation-timing-function: cubic-bezier(.35, 0, .4, 1); }
    60%, 100% { opacity: 1; transform: scale(1); }
  }
</style>
</head>
